name: Generate Dynamic Contribution Progress Animation

on:
  schedule:
    - cron: "0 */12 * * *" # Run every 12 hours
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - 'scripts/**'
      - '.github/workflows/progress-animation.yml'

jobs:
  update-progress:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Generate Dynamic Progress Animation SVG
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          python scripts/generate_progress_animation.py \
            --username "${{ github.repository_owner }}" \
            --goal 250 \
            --output assets/progress-bar.svg

      - name: Run Automated Verification Suite
        run: |
          python scripts/verify_progress_animation.py --file assets/progress-bar.svg

      - name: Commit and Push Updated SVG
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/progress-bar.svg
          if git diff --staged --quiet; then
            echo "No changes in dynamic progress animation; skipping commit."
          else
            git commit -m "chore(telemetry): update dynamic contribution progress animation [skip ci]"
            git push origin main
          fi

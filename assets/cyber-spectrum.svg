<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 160" width="100%" height="100%">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="specBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0a0e14" />
      <stop offset="50%" stop-color="#0d1117" />
      <stop offset="100%" stop-color="#080c10" />
    </linearGradient>

    <!-- Top Chrome Bar -->
    <linearGradient id="specChrome" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#161b22" />
      <stop offset="100%" stop-color="#0f141a" />
    </linearGradient>

    <!-- Channel Bar Gradient -->
    <linearGradient id="barGradEmerald" x1="0%" y1="100%" x2="0%" y2="0%">
      <stop offset="0%" stop-color="#161b22" />
      <stop offset="60%" stop-color="#238636" stop-opacity="0.6" />
      <stop offset="100%" stop-color="#3fb950" />
    </linearGradient>

    <linearGradient id="barGradActive" x1="0%" y1="100%" x2="0%" y2="0%">
      <stop offset="0%" stop-color="#161b22" />
      <stop offset="60%" stop-color="#1f6feb" stop-opacity="0.6" />
      <stop offset="100%" stop-color="#38bdf8" />
    </linearGradient>
  </defs>

  <style>
    @keyframes pulseSoft {
      0%, 100% { opacity: 1; }
      50% { opacity: 0.35; }
    }
    @keyframes waveDash {
      0% { stroke-dashoffset: 480; }
      100% { stroke-dashoffset: -480; }
    }
    @keyframes barPeakBlink {
      0%, 100% { opacity: 1; }
      50% { opacity: 0.4; }
    }
    .soft-blink {
      animation: pulseSoft 2.5s ease-in-out infinite;
    }
    .live-wave {
      stroke-dasharray: 80 400;
      animation: waveDash 3s linear infinite;
    }
    .peak-blink {
      animation: barPeakBlink 1.5s ease-in-out infinite;
    }
    .hud-title {
      font-family: 'SF Mono', 'Cascadia Code', 'Fira Code', 'Consolas', monospace;
      font-size: 10px;
      font-weight: 700;
      letter-spacing: 1.2px;
      fill: #f0f6fc;
    }
    .hud-meta {
      font-family: 'SF Mono', 'Cascadia Code', 'Fira Code', 'Consolas', monospace;
      font-size: 9px;
      letter-spacing: 0.8px;
      fill: #7d8590;
    }
    .pane-title {
      font-family: 'SF Mono', 'Cascadia Code', 'Fira Code', 'Consolas', monospace;
      font-size: 8.5px;
      font-weight: 700;
      letter-spacing: 1px;
      fill: #8b949e;
    }
    .ch-num {
      font-family: 'SF Mono', 'Cascadia Code', 'Fira Code', monospace;
      font-size: 8px;
      fill: #7d8590;
    }
    .axis-label {
      font-family: 'SF Mono', 'Cascadia Code', 'Fira Code', monospace;
      font-size: 7.5px;
      fill: #484f58;
    }
    .dissect-text {
      font-family: 'SF Mono', 'Cascadia Code', 'Fira Code', 'Consolas', monospace;
      font-size: 8.5px;
      letter-spacing: 0.6px;
      fill: #8b949e;
    }
  </style>

  <!-- Base Card Frame -->
  <rect width="900" height="160" rx="8" fill="url(#specBg)" stroke="#21262d" stroke-width="1" />

  <!-- Top System Header -->
  <rect width="900" height="30" rx="8" fill="url(#specChrome)" />
  <rect y="22" width="900" height="8" fill="url(#specChrome)" />
  <line x1="0" y1="30" x2="900" y2="30" stroke="#21262d" stroke-width="1" />

  <!-- Header Content -->
  <circle cx="18" cy="15" r="3" fill="#3fb950" class="soft-blink" />
  <text x="28" y="19" class="hud-title">RF SPECTRUM &amp; SIGNAL TELEMETRY // 2.4GHz ISM BAND &amp; FRAME DISSECTION</text>
  <text x="882" y="19" text-anchor="end" class="hud-meta">CH: 1-14 | RSSI: <tspan fill="#38bdf8">-38 dBm</tspan> | MODE: <tspan fill="#3fb950">PROMISCUOUS</tspan></text>

  <!-- ==================== PANE 1: RF CHANNEL POWER DENSITY ==================== -->
  <rect x="14" y="38" width="265" height="112" rx="4" fill="#0d1117" stroke="#21262d" stroke-width="0.8" />
  <text x="24" y="52" class="pane-title">2.4GHz CHANNEL POWER (dBm)</text>

  <!-- Grid lines & dBm scale -->
  <g stroke="#161b22" stroke-width="0.8">
    <line x1="24" y1="68" x2="269" y2="68" />
    <line x1="24" y1="92" x2="269" y2="92" />
    <line x1="24" y1="116" x2="269" y2="116" />
  </g>
  <text x="24" y="66" class="axis-label">-40</text>
  <text x="24" y="90" class="axis-label">-60</text>
  <text x="24" y="114" class="axis-label">-80</text>

  <!-- 11 Channel Bars (1-11) -->
  <!-- Ch 1 (Peak) -->
  <rect x="48" y="75" width="12" height="51" rx="1.5" fill="url(#barGradEmerald)">
    <animate attributeName="height" values="51;44;54;47;51" dur="2.2s" repeatCount="indefinite" />
    <animate attributeName="y" values="75;82;72;79;75" dur="2.2s" repeatCount="indefinite" />
  </rect>
  <line x1="48" y1="75" x2="60" y2="75" stroke="#3fb950" stroke-width="1.2">
    <animate attributeName="y1" values="75;82;72;79;75" dur="2.2s" repeatCount="indefinite" />
    <animate attributeName="y2" values="75;82;72;79;75" dur="2.2s" repeatCount="indefinite" />
  </line>
  <text x="54" y="138" text-anchor="middle" class="ch-num">1</text>

  <!-- Ch 2 -->
  <rect x="68" y="103" width="12" height="23" rx="1.5" fill="url(#barGradEmerald)" opacity="0.65">
    <animate attributeName="height" values="23;18;27;20;23" dur="2.8s" repeatCount="indefinite" />
    <animate attributeName="y" values="103;108;99;106;103" dur="2.8s" repeatCount="indefinite" />
  </rect>
  <line x1="68" y1="103" x2="80" y2="103" stroke="#3fb950" stroke-width="1.2" opacity="0.65">
    <animate attributeName="y1" values="103;108;99;106;103" dur="2.8s" repeatCount="indefinite" />
    <animate attributeName="y2" values="103;108;99;106;103" dur="2.8s" repeatCount="indefinite" />
  </line>
  <text x="74" y="138" text-anchor="middle" class="ch-num">2</text>

  <!-- Ch 3 -->
  <rect x="88" y="110" width="12" height="16" rx="1.5" fill="url(#barGradEmerald)" opacity="0.45" />
  <line x1="88" y1="110" x2="100" y2="110" stroke="#3fb950" stroke-width="1.2" opacity="0.45" />
  <text x="94" y="138" text-anchor="middle" class="ch-num">3</text>

  <!-- Ch 4 -->
  <rect x="108" y="113" width="12" height="13" rx="1.5" fill="url(#barGradEmerald)" opacity="0.4" />
  <line x1="108" y1="113" x2="120" y2="113" stroke="#3fb950" stroke-width="1.2" opacity="0.4" />
  <text x="114" y="138" text-anchor="middle" class="ch-num">4</text>

  <!-- Ch 5 -->
  <rect x="128" y="91" width="12" height="35" rx="1.5" fill="url(#barGradEmerald)" opacity="0.75">
    <animate attributeName="height" values="35;29;39;32;35" dur="1.9s" repeatCount="indefinite" />
    <animate attributeName="y" values="91;97;87;94;91" dur="1.9s" repeatCount="indefinite" />
  </rect>
  <line x1="128" y1="91" x2="140" y2="91" stroke="#3fb950" stroke-width="1.2" opacity="0.75">
    <animate attributeName="y1" values="91;97;87;94;91" dur="1.9s" repeatCount="indefinite" />
    <animate attributeName="y2" values="91;97;87;94;91" dur="1.9s" repeatCount="indefinite" />
  </line>
  <text x="134" y="138" text-anchor="middle" class="ch-num">5</text>

  <!-- Ch 6 (Active Target Peak - Blue Accent) -->
  <rect x="148" y="64" width="12" height="62" rx="1.5" fill="url(#barGradActive)">
    <animate attributeName="height" values="62;54;67;57;62" dur="1.6s" repeatCount="indefinite" />
    <animate attributeName="y" values="64;72;59;69;64" dur="1.6s" repeatCount="indefinite" />
  </rect>
  <line x1="148" y1="64" x2="160" y2="64" stroke="#38bdf8" stroke-width="1.5" class="peak-blink">
    <animate attributeName="y1" values="64;72;59;69;64" dur="1.6s" repeatCount="indefinite" />
    <animate attributeName="y2" values="64;72;59;69;64" dur="1.6s" repeatCount="indefinite" />
  </line>
  <text x="154" y="138" text-anchor="middle" class="ch-num" fill="#38bdf8" font-weight="700">6</text>

  <!-- Ch 7 -->
  <rect x="168" y="94" width="12" height="32" rx="1.5" fill="url(#barGradEmerald)" opacity="0.75">
    <animate attributeName="height" values="32;26;36;30;32" dur="2.1s" repeatCount="indefinite" />
    <animate attributeName="y" values="94;100;90;96;94" dur="2.1s" repeatCount="indefinite" />
  </rect>
  <line x1="168" y1="94" x2="180" y2="94" stroke="#3fb950" stroke-width="1.2" opacity="0.75">
    <animate attributeName="y1" values="94;100;90;96;94" dur="2.1s" repeatCount="indefinite" />
    <animate attributeName="y2" values="94;100;90;96;94" dur="2.1s" repeatCount="indefinite" />
  </line>
  <text x="174" y="138" text-anchor="middle" class="ch-num">7</text>

  <!-- Ch 8 -->
  <rect x="188" y="111" width="12" height="15" rx="1.5" fill="url(#barGradEmerald)" opacity="0.4" />
  <line x1="188" y1="111" x2="200" y2="111" stroke="#3fb950" stroke-width="1.2" opacity="0.4" />
  <text x="194" y="138" text-anchor="middle" class="ch-num">8</text>

  <!-- Ch 9 -->
  <rect x="208" y="107" width="12" height="19" rx="1.5" fill="url(#barGradEmerald)" opacity="0.5" />
  <line x1="208" y1="107" x2="220" y2="107" stroke="#3fb950" stroke-width="1.2" opacity="0.5" />
  <text x="214" y="138" text-anchor="middle" class="ch-num">9</text>

  <!-- Ch 10 -->
  <rect x="228" y="96" width="12" height="30" rx="1.5" fill="url(#barGradEmerald)" opacity="0.7">
    <animate attributeName="height" values="30;24;33;27;30" dur="2.4s" repeatCount="indefinite" />
    <animate attributeName="y" values="96;102;93;99;96" dur="2.4s" repeatCount="indefinite" />
  </rect>
  <line x1="228" y1="96" x2="240" y2="96" stroke="#3fb950" stroke-width="1.2" opacity="0.7">
    <animate attributeName="y1" values="96;102;93;99;96" dur="2.4s" repeatCount="indefinite" />
    <animate attributeName="y2" values="96;102;93;99;96" dur="2.4s" repeatCount="indefinite" />
  </line>
  <text x="234" y="138" text-anchor="middle" class="ch-num">10</text>

  <!-- Ch 11 (Peak) -->
  <rect x="248" y="73" width="12" height="53" rx="1.5" fill="url(#barGradEmerald)">
    <animate attributeName="height" values="53;45;57;49;53" dur="2.3s" repeatCount="indefinite" />
    <animate attributeName="y" values="73;81;69;77;73" dur="2.3s" repeatCount="indefinite" />
  </rect>
  <line x1="248" y1="73" x2="260" y2="73" stroke="#3fb950" stroke-width="1.2">
    <animate attributeName="y1" values="73;81;69;77;73" dur="2.3s" repeatCount="indefinite" />
    <animate attributeName="y2" values="73;81;69;77;73" dur="2.3s" repeatCount="indefinite" />
  </line>
  <text x="254" y="138" text-anchor="middle" class="ch-num">11</text>

  <!-- ==================== PANE 2: DEMODULATED BASEBAND TRACE ==================== -->
  <rect x="290" y="38" width="285" height="112" rx="4" fill="#0d1117" stroke="#21262d" stroke-width="0.8" />
  <text x="300" y="52" class="pane-title">DEMODULATED I/Q BASEBAND TRACE</text>

  <!-- Oscilloscope Reference Grid -->
  <g stroke="#161b22" stroke-width="0.8">
    <line x1="300" y1="68" x2="565" y2="68" stroke-dasharray="2,2" />
    <line x1="300" y1="94" x2="565" y2="94" />
    <line x1="300" y1="120" x2="565" y2="120" stroke-dasharray="2,2" />
    <line x1="345" y1="58" x2="345" y2="136" stroke-dasharray="2,2" />
    <line x1="400" y1="58" x2="400" y2="136" stroke-dasharray="2,2" />
    <line x1="455" y1="58" x2="455" y2="136" stroke-dasharray="2,2" />
    <line x1="510" y1="58" x2="510" y2="136" stroke-dasharray="2,2" />
  </g>
  <text x="300" y="66" class="axis-label">+1.65V</text>
  <text x="300" y="92" class="axis-label">0.00V</text>
  <text x="300" y="118" class="axis-label">-1.65V</text>

  <!-- Precision Demodulated Waveform Curve (Base & Live Signal Sweep) -->
  <path d="M 335 94 C 342 94, 348 68, 358 68 L 382 68 C 392 68, 396 120, 408 120 L 432 120 C 442 120, 446 68, 458 68 L 472 68 C 482 68, 486 94, 495 94 L 512 94 C 520 94, 524 120, 534 120 L 558 120" fill="none" stroke="#1f6feb" stroke-width="1.2" opacity="0.35" />
  <path d="M 335 94 C 342 94, 348 68, 358 68 L 382 68 C 392 68, 396 120, 408 120 L 432 120 C 442 120, 446 68, 458 68 L 472 68 C 482 68, 486 94, 495 94 L 512 94 C 520 94, 524 120, 534 120 L 558 120" fill="none" stroke="#38bdf8" stroke-width="1.8" class="live-wave" />

  <!-- Constellation Sample Points -->
  <circle cx="370" cy="68" r="2" fill="#58a6ff" />
  <circle cx="420" cy="120" r="2" fill="#58a6ff" />
  <circle cx="465" cy="68" r="2" fill="#58a6ff" />
  <circle cx="503" cy="94" r="2" fill="#3fb950" />
  <circle cx="546" cy="120" r="2" fill="#58a6ff" />

  <text x="300" y="142" class="axis-label">SYMBOL RATE: 1.0 MBaud | MOD: GFSK / QPSK</text>

  <!-- ==================== PANE 3: PACKET HEADER DISSECTION ==================== -->
  <rect x="586" y="38" width="300" height="112" rx="4" fill="#0d1117" stroke="#21262d" stroke-width="0.8" />
  <text x="596" y="52" class="pane-title">LIVE 802.11 FRAME DISSECTION</text>
  <rect x="808" y="44" width="70" height="12" rx="2" fill="#16231c" stroke="#3fb950" stroke-width="0.8" />
  <text x="843" y="53" text-anchor="middle" font-family="'SF Mono', monospace" font-size="7.5" fill="#3fb950" font-weight="600">PROMISCUOUS</text>

  <g transform="translate(596, 68)">
    <text y="0" class="dissect-text">FRAME_TYPE : <tspan fill="#3fb950">0x08 [BEACON / PROBE]</tspan></text>
    <text y="13" class="dissect-text">SUBTYPE    : <tspan fill="#c9d1d9">MANAGEMENT FRAME</tspan></text>
    <text y="26" class="dissect-text">BSSID      : <tspan fill="#58a6ff">1A:2B:3C:4D:5E:6F</tspan></text>
    <text y="39" class="dissect-text">SSID       : <tspan fill="#e3b341">&lt;SIGINT_LAB_01&gt;</tspan></text>
    <text y="52" class="dissect-text">CHANNEL    : <tspan fill="#38bdf8">06 (2437 MHz) // -38dBm</tspan></text>
    <text y="65" class="dissect-text">CRC / FCS  : <tspan fill="#3fb950">0x8F3D [VALID / OK]</tspan></text>
  </g>
</svg>

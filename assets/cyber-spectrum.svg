<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 160" width="100%" height="100%">
  <defs>
    <linearGradient id="specBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#04070c" />
      <stop offset="50%" stop-color="#090e17" />
      <stop offset="100%" stop-color="#03060a" />
    </linearGradient>

    <linearGradient id="barGrad" x1="0%" y1="100%" x2="0%" y2="0%">
      <stop offset="0%" stop-color="#00ff66" stop-opacity="0.3" />
      <stop offset="60%" stop-color="#00f0ff" stop-opacity="0.85" />
      <stop offset="100%" stop-color="#ff0055" />
    </linearGradient>

    <pattern id="hudGrid" width="15" height="15" patternUnits="userSpaceOnUse">
      <path d="M 15 0 L 0 0 0 15" fill="none" stroke="#00ff66" stroke-width="0.4" stroke-opacity="0.07" />
    </pattern>

    <filter id="glowS" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="2.5" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>
  </defs>

  <style>
    @keyframes barBounce1 { 0%, 100% { height: 18px; y: 112px; } 50% { height: 62px; y: 68px; } }
    @keyframes barBounce2 { 0%, 100% { height: 50px; y: 80px; } 50% { height: 22px; y: 108px; } }
    @keyframes barBounce3 { 0%, 100% { height: 35px; y: 95px; } 50% { height: 75px; y: 55px; } }
    @keyframes barBounce4 { 0%, 100% { height: 70px; y: 60px; } 50% { height: 30px; y: 100px; } }
    @keyframes barBounce5 { 0%, 100% { height: 25px; y: 105px; } 50% { height: 58px; y: 72px; } }
    @keyframes barBounce6 { 0%, 100% { height: 60px; y: 70px; } 50% { height: 15px; y: 115px; } }
    @keyframes barBounce7 { 0%, 100% { height: 40px; y: 90px; } 50% { height: 68px; y: 62px; } }

    @keyframes osciFlow {
      0% { transform: translateX(0); }
      100% { transform: translateX(-400px); }
    }
    @keyframes hexScroll {
      0% { transform: translateX(0); }
      100% { transform: translateX(-350px); }
    }
    @keyframes blinkRec {
      0%, 100% { opacity: 1; }
      50% { opacity: 0.15; }
    }

    .b1 { animation: barBounce1 1.2s infinite ease-in-out; }
    .b2 { animation: barBounce2 1.5s infinite ease-in-out; }
    .b3 { animation: barBounce3 0.9s infinite ease-in-out; }
    .b4 { animation: barBounce4 1.7s infinite ease-in-out; }
    .b5 { animation: barBounce5 1.1s infinite ease-in-out; }
    .b6 { animation: barBounce6 1.4s infinite ease-in-out; }
    .b7 { animation: barBounce7 1.0s infinite ease-in-out; }

    .osci-wave { animation: osciFlow 4s linear infinite; }
    .hex-stream { animation: hexScroll 12s linear infinite; }
    .rec-dot { animation: blinkRec 1s infinite; }

    .hud-title {
      font-family: 'SF Mono', 'Fira Code', 'Cascadia Code', monospace;
      font-size: 11px;
      font-weight: 700;
      letter-spacing: 2px;
      fill: #00ff66;
    }
    .hud-meta {
      font-family: 'SF Mono', 'Fira Code', monospace;
      font-size: 9.5px;
      letter-spacing: 1px;
      fill: #8b949e;
    }
    .hex-code {
      font-family: 'SF Mono', 'Fira Code', monospace;
      font-size: 10px;
      fill: #00f0ff;
      letter-spacing: 2px;
    }
  </style>

  <!-- Container Box -->
  <rect width="900" height="160" rx="10" fill="url(#specBg)" stroke="#30363d" stroke-width="1.2" />
  <rect width="900" height="160" rx="10" fill="url(#hudGrid)" />

  <!-- Top Bar HUD -->
  <g transform="translate(20, 24)">
    <circle cx="5" cy="0" r="4" fill="#ff0055" class="rec-dot" filter="url(#glowS)" />
    <text x="16" y="4" class="hud-title">REAL-TIME FORENSICS TELEMETRY // SIGNAL &amp; PACKET SPECTRUM</text>
    <text x="610" y="4" class="hud-meta">CH: 1-14 [2.4GHz] | USB OTG: RAW CAPTURE</text>
  </g>

  <!-- Divider Line -->
  <line x1="20" y1="38" x2="880" y2="38" stroke="#30363d" stroke-width="1" />

  <!-- Left: Animated RF Spectrum Equalizer Bars -->
  <g transform="translate(30, 0)">
    <text x="0" y="55" class="hud-meta">SPECTRUM INTENSITY (dBm)</text>
    
    <rect x="0" y="112" width="14" height="18" rx="2" fill="url(#barGrad)" class="b1" />
    <rect x="18" y="80" width="14" height="50" rx="2" fill="url(#barGrad)" class="b2" />
    <rect x="36" y="95" width="14" height="35" rx="2" fill="url(#barGrad)" class="b3" />
    <rect x="54" y="60" width="14" height="70" rx="2" fill="url(#barGrad)" class="b4" />
    <rect x="72" y="105" width="14" height="25" rx="2" fill="url(#barGrad)" class="b5" />
    <rect x="90" y="70" width="14" height="60" rx="2" fill="url(#barGrad)" class="b6" />
    <rect x="108" y="90" width="14" height="40" rx="2" fill="url(#barGrad)" class="b7" />
    <rect x="126" y="95" width="14" height="35" rx="2" fill="url(#barGrad)" class="b3" />
    <rect x="144" y="80" width="14" height="50" rx="2" fill="url(#barGrad)" class="b2" />
    <rect x="162" y="112" width="14" height="18" rx="2" fill="url(#barGrad)" class="b1" />

    <!-- Channel Labels -->
    <text x="0" y="145" class="hud-meta">CH1</text>
    <text x="54" y="145" class="hud-meta">CH6</text>
    <text x="108" y="145" class="hud-meta">CH11</text>
    <text x="156" y="145" class="hud-meta">5GHz</text>
  </g>

  <!-- Center: Live Signal Oscilloscope Trace -->
  <g transform="translate(260, 48)">
    <rect width="280" height="92" rx="4" fill="#03060a" stroke="#21262d" stroke-width="1" />
    <text x="10" y="18" class="hud-meta">OSCILLOSCOPE: 802.11 / UART</text>
    
    <!-- Clipping window for continuous wave -->
    <svg x="10" y="24" width="260" height="60" viewBox="0 0 260 60">
      <path class="osci-wave" d="M 0 30 Q 25 5, 50 30 T 100 30 T 150 30 T 200 30 T 250 30 T 300 30 T 350 30 T 400 30 T 450 30 T 500 30 T 550 30 T 600 30 T 650 30" fill="none" stroke="#00ff66" stroke-width="1.8" filter="url(#glowS)" />
      <path class="osci-wave" d="M 0 30 Q 15 55, 30 30 T 60 30 T 90 30 T 120 30 T 150 30 T 180 30 T 210 30 T 240 30 T 270 30 T 300 30 T 330 30 T 360 30 T 390 30" fill="none" stroke="#00f0ff" stroke-width="1" opacity="0.6" />
    </svg>
  </g>

  <!-- Right: Hex Packet Forensics Dump Stream -->
  <g transform="translate(570, 48)">
    <rect width="300" height="92" rx="4" fill="#03060a" stroke="#21262d" stroke-width="1" />
    <text x="10" y="18" class="hud-meta">RAW PACKET CAPTURE // HEX STREAM</text>
    
    <svg x="10" y="26" width="280" height="58" viewBox="0 0 280 58">
      <g class="hex-stream">
        <text x="0" y="16" class="hex-code">7F 45 4C 46 02 01 01 00 00 00 00 00 00 00 00 00 03 00 3E 00</text>
        <text x="0" y="34" class="hex-code">A0 00 00 00 00 00 00 00 80 11 00 00 00 00 00 00 5C 3E E8 FF</text>
        <text x="0" y="52" class="hex-code">53 4E 4F 52 54 59 5F 45 53 50 33 32 5F 57 41 52 44 52 49 56</text>
        
        <!-- Duplicated for seamless loop -->
        <text x="350" y="16" class="hex-code">7F 45 4C 46 02 01 01 00 00 00 00 00 00 00 00 00 03 00 3E 00</text>
        <text x="350" y="34" class="hex-code">A0 00 00 00 00 00 00 00 80 11 00 00 00 00 00 00 5C 3E E8 FF</text>
        <text x="350" y="52" class="hex-code">53 4E 4F 52 54 59 5F 45 53 50 33 32 5F 57 41 52 44 52 49 56</text>
      </g>
    </svg>
  </g>
</svg>

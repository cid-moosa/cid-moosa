<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 64" width="100%" height="100%">
  <defs>
    <!-- Gradients -->
    <linearGradient id="laserGradL" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#00ff66" stop-opacity="0" />
      <stop offset="70%" stop-color="#00ff66" stop-opacity="0.8" />
      <stop offset="100%" stop-color="#00f0ff" stop-opacity="1" />
    </linearGradient>

    <linearGradient id="laserGradR" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#00f0ff" stop-opacity="1" />
      <stop offset="30%" stop-color="#7000ff" stop-opacity="0.8" />
      <stop offset="100%" stop-color="#ff0055" stop-opacity="0" />
    </linearGradient>

    <filter id="neonGlow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="3.5" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>

    <filter id="sharpGlow">
      <feGaussianBlur stdDeviation="1.5" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>
  </defs>

  <style>
    @keyframes pulseCoreHex {
      0%, 100% { fill: #00ff66; filter: drop-shadow(0 0 8px #00ff66); }
      50% { fill: #00f0ff; filter: drop-shadow(0 0 14px #00f0ff); }
    }
    @keyframes rotateReticle {
      0% { transform: rotate(0deg); }
      100% { transform: rotate(360deg); }
    }
    @keyframes rotateReverse {
      0% { transform: rotate(360deg); }
      100% { transform: rotate(0deg); }
    }
    @keyframes streamPacketsL {
      0% { transform: translateX(0); opacity: 0; }
      50% { opacity: 1; }
      100% { transform: translateX(200px); opacity: 0; }
    }
    @keyframes streamPacketsR {
      0% { transform: translateX(0); opacity: 0; }
      50% { opacity: 1; }
      100% { transform: translateX(-200px); opacity: 0; }
    }
    @keyframes laserFlicker {
      0%, 100% { opacity: 0.9; }
      50% { opacity: 0.6; }
    }

    .reticle-spin {
      transform-origin: 450px 32px;
      animation: rotateReticle 10s linear infinite;
    }
    .reticle-rev {
      transform-origin: 450px 32px;
      animation: rotateReverse 6s linear infinite;
    }
    .core-hex {
      animation: pulseCoreHex 2.5s infinite ease-in-out;
    }
    .packet-l {
      animation: streamPacketsL 2.5s infinite linear;
    }
    .packet-r {
      animation: streamPacketsR 2.5s infinite linear;
    }
    .laser-beam {
      animation: laserFlicker 2s infinite ease-in-out;
    }
    .hud-code {
      font-family: 'SF Mono', 'Fira Code', 'Cascadia Code', monospace;
      font-size: 10px;
      font-weight: 700;
      letter-spacing: 3px;
      fill: #00ff66;
    }
    .bracket-text {
      font-family: 'SF Mono', 'Fira Code', monospace;
      font-size: 9px;
      fill: #8b949e;
      letter-spacing: 2px;
    }
  </style>

  <rect width="900" height="64" fill="transparent" />

  <!-- Top Micro-Telemetry Labels -->
  <text x="50" y="18" class="bracket-text">RAW_PACKET_BUS // 0x80211</text>
  <text x="850" y="18" text-anchor="end" class="bracket-text">SIGINT_LINK // ACTIVE</text>

  <!-- Left Laser Rail -->
  <line x1="40" y1="32" x2="415" y2="32" stroke="url(#laserGradL)" stroke-width="2" class="laser-beam" filter="url(#neonGlow)" />
  <line x1="40" y1="32" x2="415" y2="32" stroke="#ffffff" stroke-width="0.8" opacity="0.9" />

  <!-- Right Laser Rail -->
  <line x1="485" y1="32" x2="860" y2="32" stroke="url(#laserGradR)" stroke-width="2" class="laser-beam" filter="url(#neonGlow)" />
  <line x1="485" y1="32" x2="860" y2="32" stroke="#ffffff" stroke-width="0.8" opacity="0.9" />

  <!-- Left Streaming Data Packets (>>>) -->
  <g class="packet-l">
    <path d="M 120 27 L 128 32 L 120 37" fill="none" stroke="#00ff66" stroke-width="1.8" filter="url(#sharpGlow)" />
    <path d="M 135 27 L 143 32 L 135 37" fill="none" stroke="#00f0ff" stroke-width="1.8" filter="url(#sharpGlow)" />
    <path d="M 150 27 L 158 32 L 150 37" fill="none" stroke="#00ff66" stroke-width="1.8" filter="url(#sharpGlow)" />
  </g>

  <!-- Right Streaming Data Packets (<<<) -->
  <g class="packet-r">
    <path d="M 780 27 L 772 32 L 780 37" fill="none" stroke="#ff0055" stroke-width="1.8" filter="url(#sharpGlow)" />
    <path d="M 765 27 L 757 32 L 765 37" fill="none" stroke="#7000ff" stroke-width="1.8" filter="url(#sharpGlow)" />
    <path d="M 750 27 L 742 32 L 750 37" fill="none" stroke="#00f0ff" stroke-width="1.8" filter="url(#sharpGlow)" />
  </g>

  <!-- End Diamond Nodes -->
  <polygon points="40,32 46,27 52,32 46,37" fill="#00ff66" filter="url(#sharpGlow)" />
  <polygon points="860,32 854,27 848,32 854,37" fill="#ff0055" filter="url(#sharpGlow)" />

  <!-- Center Core Reticle (High-Tech Rotating HUD Target) -->
  <!-- Outer Rotating Hexagon Frame -->
  <g class="reticle-spin">
    <polygon points="450,14 466,23 466,41 450,50 434,41 434,23" fill="none" stroke="#00f0ff" stroke-width="1.2" opacity="0.6" stroke-dasharray="8 4" />
  </g>

  <!-- Inner Counter-Rotating Reticle Ring -->
  <g class="reticle-rev">
    <circle cx="450" cy="32" r="12" fill="none" stroke="#00ff66" stroke-width="1.5" stroke-dasharray="5 5" />
    <line x1="450" y1="18" x2="450" y2="46" stroke="#00ff66" stroke-width="0.8" opacity="0.7" />
    <line x1="436" y1="32" x2="464" y2="32" stroke="#00ff66" stroke-width="0.8" opacity="0.7" />
  </g>

  <!-- Center Glowing Cyber Diamond Core -->
  <polygon points="450,26 456,32 450,38 444,32" class="core-hex" filter="url(#neonGlow)" />

  <!-- Bottom Telemetry Caption -->
  <text x="450" y="58" text-anchor="middle" class="hud-code">⚡ DF_ENCRYPTED_STREAM // RECON_LAYER ⚡</text>
</svg>

<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 70" width="100%" height="100%">
  <defs>
    <linearGradient id="gradDiv" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#00ff66" stop-opacity="0" />
      <stop offset="25%" stop-color="#00ff66" stop-opacity="0.8" />
      <stop offset="50%" stop-color="#00f0ff" stop-opacity="1" />
      <stop offset="75%" stop-color="#7000ff" stop-opacity="0.8" />
      <stop offset="100%" stop-color="#7000ff" stop-opacity="0" />
    </linearGradient>
    <filter id="glowD" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="3" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>
  </defs>
  <style>
    @keyframes pulseRing {
      0% { r: 6px; opacity: 1; }
      50% { r: 14px; opacity: 0.4; }
      100% { r: 22px; opacity: 0; }
    }
    @keyframes pulseCore {
      0%, 100% { opacity: 0.7; r: 5px; }
      50% { opacity: 1; r: 7px; filter: drop-shadow(0 0 8px #00ff66); }
    }
    @keyframes laserSweep {
      0% { stroke-dashoffset: 400; }
      100% { stroke-dashoffset: 0; }
    }
    .core-dot {
      animation: pulseCore 2s infinite ease-in-out;
    }
    .expanding-ring {
      animation: pulseRing 2s infinite ease-out;
    }
    .laser-line {
      stroke-dasharray: 80 120;
      animation: laserSweep 3s linear infinite;
    }
    .radar-text {
      font-family: 'SF Mono', 'Fira Code', 'Cascadia Code', monospace;
      font-size: 10px;
      font-weight: 700;
      letter-spacing: 3.5px;
      fill: #00ff66;
    }
  </style>

  <rect width="900" height="70" fill="transparent" />

  <!-- Left & Right Flowing Laser Beams -->
  <line x1="30" y1="35" x2="350" y2="35" stroke="url(#gradDiv)" stroke-width="2" class="laser-line" filter="url(#glowD)" />
  <line x1="550" y1="35" x2="870" y2="35" stroke="url(#gradDiv)" stroke-width="2" class="laser-line" filter="url(#glowD)" />

  <!-- Fixed Target Nodes -->
  <circle cx="30" cy="35" r="3" fill="#00ff66" />
  <circle cx="180" cy="35" r="2.5" fill="#00f0ff" />
  <circle cx="720" cy="35" r="2.5" fill="#00f0ff" />
  <circle cx="870" cy="35" r="3" fill="#7000ff" />

  <!-- Center Radar Telemetry Hub (Perfect Absolute Coordinates) -->
  <circle cx="450" cy="35" r="16" fill="none" stroke="#00f0ff" stroke-width="1.2" opacity="0.4" />
  <circle cx="450" cy="35" class="expanding-ring" fill="none" stroke="#00ff66" stroke-width="1.5" />
  <circle cx="450" cy="35" class="core-dot" fill="#00ff66" filter="url(#glowD)" />
  
  <text x="450" y="16" text-anchor="middle" class="radar-text">[ RF SPECTRUM // TELEMETRY LINK ]</text>
</svg>

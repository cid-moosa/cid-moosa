<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 12" width="100%" height="100%">
  <defs>
    <linearGradient id="laserLine" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#00ff66" stop-opacity="0" />
      <stop offset="20%" stop-color="#00ff66" stop-opacity="0.8" />
      <stop offset="50%" stop-color="#00f0ff" stop-opacity="1" />
      <stop offset="80%" stop-color="#ff0055" stop-opacity="0.8" />
      <stop offset="100%" stop-color="#7000ff" stop-opacity="0" />
    </linearGradient>
    <filter id="laserGlow" x="-20%" y="-100%" width="140%" height="300%">
      <feGaussianBlur stdDeviation="2" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>
  </defs>
  <style>
    @keyframes sweepLaser {
      0% { transform: translateX(-300px); }
      100% { transform: translateX(1000px); }
    }
    .laser-spark {
      animation: sweepLaser 3.5s ease-in-out infinite;
    }
  </style>
  <rect width="900" height="12" fill="transparent" />
  <line x1="20" y1="6" x2="880" y2="6" stroke="url(#laserLine)" stroke-width="1.5" />
  <g class="laser-spark">
    <line x1="0" y1="6" x2="140" y2="6" stroke="#ffffff" stroke-width="2.2" filter="url(#laserGlow)" />
  </g>
</svg>

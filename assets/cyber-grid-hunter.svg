<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 170" width="100%" height="100%">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="crtBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#03060a" />
      <stop offset="50%" stop-color="#080e18" />
      <stop offset="100%" stop-color="#020408" />
    </linearGradient>

    <!-- Glowing Filters -->
    <filter id="neonG" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="2" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>

    <filter id="goldGlow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="3" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>

    <!-- Grid Pattern -->
    <pattern id="dotMatrix" width="20" height="20" patternUnits="userSpaceOnUse">
      <circle cx="10" cy="10" r="1" fill="#00ff66" fill-opacity="0.1" />
    </pattern>
  </defs>

  <style>
    .arcade-font {
      font-family: 'Courier New', 'SF Mono', 'Fira Code', monospace;
      font-weight: 900;
      font-size: 11px;
      letter-spacing: 2px;
    }
  </style>

  <!-- Frame Background -->
  <rect width="880" height="170" rx="10" fill="url(#crtBg)" stroke="#30363d" stroke-width="1.5" />
  <rect width="880" height="170" rx="10" fill="url(#dotMatrix)" />

  <!-- CRT Scanline Simulation -->
  <g opacity="0.08">
    <rect x="0" y="0" width="880" height="15" fill="#00ff66">
      <animateTransform attributeName="transform" type="translate" from="0 -10" to="0 180" dur="3s" repeatCount="indefinite" />
    </rect>
  </g>

  <!-- Arcade HUD Score Header -->
  <g transform="translate(25, 24)">
    <text x="0" y="0" fill="#00ff66" class="arcade-font" filter="url(#neonG)">HIGH_SCORE: 133,700</text>
    <text x="240" y="0" fill="#00f0ff" class="arcade-font">MODE: 802.11 PACKET_SNIFFER</text>
    <text x="560" y="0" fill="#ffdd54" class="arcade-font">LEVEL: SIGINT_LAB</text>
    <text x="760" y="0" fill="#ff0055" class="arcade-font">LIVES: 3</text>
  </g>

  <!-- Neon Blue Cyber Rails -->
  <g fill="none" stroke="#00f0ff" stroke-width="2" filter="url(#neonG)" opacity="0.7">
    <line x1="20" y1="48" x2="860" y2="48" />
    <line x1="20" y1="135" x2="860" y2="135" />
  </g>

  <!-- Track Data Pellets with Direct SMIL Consumption Sync -->
  <g fill="#ffdd54" filter="url(#neonG)" transform="translate(0, 92)">
    <!-- Pellets disappear as Pacman arrives at each coordinate -->
    <circle cx="50" cy="0" r="3.5">
      <animate attributeName="opacity" values="1;0.08;1" keyTimes="0;0.08;0.98" dur="6s" repeatCount="indefinite" />
    </circle>
    <circle cx="100" cy="0" r="3.5">
      <animate attributeName="opacity" values="1;0.08;1" keyTimes="0;0.14;0.98" dur="6s" repeatCount="indefinite" />
    </circle>
    <circle cx="150" cy="0" r="3.5">
      <animate attributeName="opacity" values="1;0.08;1" keyTimes="0;0.19;0.98" dur="6s" repeatCount="indefinite" />
    </circle>
    <!-- Big Energizer Power Pellet -->
    <circle cx="200" cy="0" r="6.5" fill="#00ff66" filter="url(#goldGlow)">
      <animate attributeName="opacity" values="1;0.08;1" keyTimes="0;0.24;0.98" dur="6s" repeatCount="indefinite" />
      <animate attributeName="r" values="6;7.5;6" dur="0.8s" repeatCount="indefinite" />
    </circle>
    <circle cx="250" cy="0" r="3.5">
      <animate attributeName="opacity" values="1;0.08;1" keyTimes="0;0.29;0.98" dur="6s" repeatCount="indefinite" />
    </circle>
    <circle cx="300" cy="0" r="3.5">
      <animate attributeName="opacity" values="1;0.08;1" keyTimes="0;0.34;0.98" dur="6s" repeatCount="indefinite" />
    </circle>
    <circle cx="350" cy="0" r="3.5">
      <animate attributeName="opacity" values="1;0.08;1" keyTimes="0;0.39;0.98" dur="6s" repeatCount="indefinite" />
    </circle>
    <circle cx="400" cy="0" r="3.5">
      <animate attributeName="opacity" values="1;0.08;1" keyTimes="0;0.44;0.98" dur="6s" repeatCount="indefinite" />
    </circle>
    <!-- Second Power Pellet -->
    <circle cx="450" cy="0" r="6.5" fill="#ff0055" filter="url(#goldGlow)">
      <animate attributeName="opacity" values="1;0.08;1" keyTimes="0;0.49;0.98" dur="6s" repeatCount="indefinite" />
      <animate attributeName="r" values="6;7.5;6" dur="0.8s" repeatCount="indefinite" />
    </circle>
    <circle cx="500" cy="0" r="3.5">
      <animate attributeName="opacity" values="1;0.08;1" keyTimes="0;0.54;0.98" dur="6s" repeatCount="indefinite" />
    </circle>
    <circle cx="550" cy="0" r="3.5">
      <animate attributeName="opacity" values="1;0.08;1" keyTimes="0;0.59;0.98" dur="6s" repeatCount="indefinite" />
    </circle>
    <circle cx="600" cy="0" r="3.5">
      <animate attributeName="opacity" values="1;0.08;1" keyTimes="0;0.64;0.98" dur="6s" repeatCount="indefinite" />
    </circle>
    <circle cx="650" cy="0" r="3.5">
      <animate attributeName="opacity" values="1;0.08;1" keyTimes="0;0.69;0.98" dur="6s" repeatCount="indefinite" />
    </circle>
    <!-- Third Power Pellet -->
    <circle cx="700" cy="0" r="6.5" fill="#00f0ff" filter="url(#goldGlow)">
      <animate attributeName="opacity" values="1;0.08;1" keyTimes="0;0.74;0.98" dur="6s" repeatCount="indefinite" />
      <animate attributeName="r" values="6;7.5;6" dur="0.8s" repeatCount="indefinite" />
    </circle>
    <circle cx="750" cy="0" r="3.5">
      <animate attributeName="opacity" values="1;0.08;1" keyTimes="0;0.79;0.98" dur="6s" repeatCount="indefinite" />
    </circle>
    <circle cx="800" cy="0" r="3.5">
      <animate attributeName="opacity" values="1;0.08;1" keyTimes="0;0.84;0.98" dur="6s" repeatCount="indefinite" />
    </circle>
    <circle cx="840" cy="0" r="3.5">
      <animate attributeName="opacity" values="1;0.08;1" keyTimes="0;0.89;0.98" dur="6s" repeatCount="indefinite" />
    </circle>
  </g>

  <!-- Pacman Actor (Smooth Native Path Morph Chomp - Zero CSS Glitches) -->
  <g>
    <animateTransform attributeName="transform" type="translate" from="-40 92" to="920 92" dur="6s" repeatCount="indefinite" />
    
    <g filter="url(#goldGlow)">
      <!-- Morphing Mouth Arc (Mouth Closed -> Open -> Closed) -->
      <path fill="#ffd700">
        <animate attributeName="d" dur="0.25s" repeatCount="indefinite"
          values="M 0,0 L 14,-1 A 14,14 0 1,0 14,1 Z;
                  M 0,0 L 11,-9 A 14,14 0 1,0 11,9 Z;
                  M 0,0 L 14,-1 A 14,14 0 1,0 14,1 Z" />
      </path>
      <!-- Pacman Eye -->
      <circle cx="1" cy="-7" r="2.2" fill="#020408" />
    </g>
  </g>

  <!-- Blinky (Red Ghost Chaser) -->
  <g>
    <animateTransform attributeName="transform" type="translate" from="-120 92" to="840 92" dur="6s" repeatCount="indefinite" />
    
    <g filter="url(#neonG)">
      <!-- Animated Floating Body -->
      <g>
        <animateTransform attributeName="transform" type="translate" values="0 0; 0 -3; 0 0" dur="0.4s" repeatCount="indefinite" />
        <path d="M -12,-3 A 12,12 0 0,1 12,-3 L 12,10 L 8,7 L 4,10 L 0,7 L -4,10 L -8,7 L -12,10 Z" fill="#ff0055" />
        <!-- Eyes -->
        <ellipse cx="-4" cy="-4" rx="3.5" ry="4.5" fill="#ffffff" />
        <ellipse cx="4" cy="-4" rx="3.5" ry="4.5" fill="#ffffff" />
        <circle cx="-2" cy="-4" r="2" fill="#00f0ff" />
        <circle cx="6" cy="-4" r="2" fill="#00f0ff" />
      </g>
    </g>
  </g>

  <!-- Inky (Cyan Ghost Chaser) -->
  <g>
    <animateTransform attributeName="transform" type="translate" from="-170 92" to="790 92" dur="6s" repeatCount="indefinite" />
    
    <g filter="url(#neonG)">
      <!-- Animated Floating Body with Phase Offset -->
      <g>
        <animateTransform attributeName="transform" type="translate" values="0 -3; 0 0; 0 -3" dur="0.4s" repeatCount="indefinite" />
        <path d="M -12,-3 A 12,12 0 0,1 12,-3 L 12,10 L 8,7 L 4,10 L 0,7 L -4,10 L -8,7 L -12,10 Z" fill="#00f0ff" />
        <!-- Eyes -->
        <ellipse cx="-4" cy="-4" rx="3.5" ry="4.5" fill="#ffffff" />
        <ellipse cx="4" cy="-4" rx="3.5" ry="4.5" fill="#ffffff" />
        <circle cx="-2" cy="-4" r="2" fill="#020408" />
        <circle cx="6" cy="-4" r="2" fill="#020408" />
      </g>
    </g>
  </g>

  <!-- Bottom Console Status Bar -->
  <g transform="translate(25, 155)">
    <text x="0" y="0" fill="#8b949e" class="arcade-font" font-size="9.5px">RAW_FRAME: 802.11 BEACON  |  MAC: DE:AD:BE:EF:CA:FE  |  ESP32_SNIFFER: ACTIVE  |  HARDWARE_SMIL: 60 FPS</text>
  </g>
</svg>

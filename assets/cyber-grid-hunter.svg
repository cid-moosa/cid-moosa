<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 200" width="100%" height="100%">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="crtBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#020408" />
      <stop offset="50%" stop-color="#080d16" />
      <stop offset="100%" stop-color="#020408" />
    </linearGradient>

    <!-- Neon Glow Filters -->
    <filter id="neonG" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="2" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>

    <filter id="strongG" x="-40%" y="-40%" width="180%" height="180%">
      <feGaussianBlur stdDeviation="3.5" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>

    <!-- Grid Pattern -->
    <pattern id="dotMatrix" width="20" height="20" patternUnits="userSpaceOnUse">
      <circle cx="10" cy="10" r="1.2" fill="#00ff66" fill-opacity="0.12" />
    </pattern>
  </defs>

  <style>
    /* Pacman Chomp (Scale Y of background wedge cutout) */
    @keyframes chomp {
      0%, 100% { transform: scaleY(0.08); }
      50% { transform: scaleY(1); }
    }

    /* Pacman Waypoint Pathing */
    @keyframes pacmanPath {
      0% { transform: translate(30px, 90px); }
      46% { transform: translate(430px, 90px); }
      48% { transform: translate(430px, 140px); }
      96% { transform: translate(840px, 140px); }
      100% { transform: translate(880px, 140px); }
    }

    /* Ghost Chaser Pathing (Behind Pacman) */
    @keyframes ghostPath {
      0% { transform: translate(-30px, 90px); }
      46% { transform: translate(370px, 90px); }
      48% { transform: translate(370px, 140px); }
      96% { transform: translate(780px, 140px); }
      100% { transform: translate(820px, 140px); }
    }

    /* Ghost Floating & Frightened Color Shift when Power Pellet is eaten */
    @keyframes ghostHover {
      0%, 100% { transform: translateY(0); }
      50% { transform: translateY(-3px); }
    }

    @keyframes ghostState {
      0%, 55% { fill: #ff0055; }
      60%, 85% { fill: #2b59ff; } /* Vulnerable / Frightened Blue */
      86%, 100% { fill: #ff0055; }
    }

    /* Pellet Sequential Consumption Sync */
    @keyframes dot1 { 0%, 6% { opacity: 1; } 10%, 100% { opacity: 0.08; } }
    @keyframes dot2 { 0%, 14% { opacity: 1; } 18%, 100% { opacity: 0.08; } }
    @keyframes dot3 { 0%, 22% { opacity: 1; } 26%, 100% { opacity: 0.08; } }
    @keyframes dot4 { 0%, 30% { opacity: 1; } 34%, 100% { opacity: 0.08; } }
    @keyframes dot5 { 0%, 38% { opacity: 1; } 42%, 100% { opacity: 0.08; } }
    @keyframes dot6 { 0%, 46% { opacity: 1; } 50%, 100% { opacity: 0.08; } }
    @keyframes dot7 { 0%, 58% { opacity: 1; } 62%, 100% { opacity: 0.08; } }
    @keyframes dot8 { 0%, 68% { opacity: 1; } 72%, 100% { opacity: 0.08; } }
    @keyframes dot9 { 0%, 78% { opacity: 1; } 82%, 100% { opacity: 0.08; } }
    @keyframes dot10 { 0%, 88% { opacity: 1; } 92%, 100% { opacity: 0.08; } }

    /* Power Pellet Flash */
    @keyframes powerFlash {
      0%, 100% { r: 6px; opacity: 1; fill: #00ff66; filter: drop-shadow(0 0 6px #00ff66); }
      50% { r: 7.5px; opacity: 0.7; fill: #ffdd54; filter: drop-shadow(0 0 12px #ffdd54); }
    }

    @keyframes crtSweep {
      0% { transform: translateY(-10px); }
      100% { transform: translateY(210px); }
    }

    .mouth {
      transform-origin: 0px 0px;
      animation: chomp 0.28s infinite ease-in-out;
    }
    .pacman-actor { animation: pacmanPath 7s infinite linear; }
    .ghost-actor { animation: ghostPath 7s infinite linear; }
    .ghost-motion { animation: ghostHover 0.4s infinite ease-in-out; }
    .ghost-color { animation: ghostState 7s infinite; }

    .d1 { animation: dot1 7s infinite; }
    .d2 { animation: dot2 7s infinite; }
    .d3 { animation: dot3 7s infinite; }
    .d4 { animation: dot4 7s infinite; }
    .d5 { animation: dot5 7s infinite; }
    .d6 { animation: dot6 7s infinite; }
    .d7 { animation: dot7 7s infinite; }
    .d8 { animation: dot8 7s infinite; }
    .d9 { animation: dot9 7s infinite; }
    .d10 { animation: dot10 7s infinite; }

    .power-dot { animation: powerFlash 1s infinite; }
    .scan-beam { animation: crtSweep 3.5s linear infinite; }

    .hud-text {
      font-family: 'Courier New', 'SF Mono', 'Fira Code', monospace;
      font-weight: 900;
      font-size: 11px;
      letter-spacing: 2px;
    }
  </style>

  <!-- Frame Background -->
  <rect width="880" height="200" rx="10" fill="url(#crtBg)" stroke="#30363d" stroke-width="1.5" />
  <rect width="880" height="200" rx="10" fill="url(#dotMatrix)" />

  <!-- CRT Scanline Simulation -->
  <g class="scan-beam" opacity="0.1">
    <rect x="0" y="0" width="880" height="18" fill="#00ff66" />
  </g>

  <!-- Arcade HUD Score Header -->
  <g transform="translate(25, 24)">
    <text x="0" y="0" fill="#00ff66" class="hud-text" filter="url(#neonG)">HIGH_SCORE: 133,700</text>
    <text x="240" y="0" fill="#00f0ff" class="hud-text">SIGINT: PACKET_HUNTER</text>
    <text x="540" y="0" fill="#ffdd54" class="hud-text">LEVEL: FORENSICS_LAB</text>
    <text x="760" y="0" fill="#ff0055" class="hud-text">LIVES: 3</text>
  </g>

  <!-- Maze Walls & Glowing Neon Rails -->
  <g fill="none" stroke-width="2" filter="url(#neonG)">
    <!-- Outer Horizontal Tracks -->
    <path d="M 25 46 L 855 46" stroke="#00f0ff" opacity="0.6" />
    <path d="M 25 180 L 855 180" stroke="#00f0ff" opacity="0.6" />

    <!-- Neon Maze Blocks -->
    <rect x="70" y="62" width="130" height="14" rx="4" stroke="#7000ff" />
    <rect x="240" y="62" width="150" height="14" rx="4" stroke="#00ff66" />
    <rect x="490" y="62" width="150" height="14" rx="4" stroke="#00ff66" />
    <rect x="680" y="62" width="130" height="14" rx="4" stroke="#7000ff" />

    <rect x="70" y="114" width="130" height="14" rx="4" stroke="#00ff66" />
    <rect x="240" y="114" width="210" height="14" rx="4" stroke="#7000ff" />
    <rect x="490" y="114" width="210" height="14" rx="4" stroke="#7000ff" />
    <rect x="740" y="114" width="70" height="14" rx="4" stroke="#00ff66" />
  </g>

  <!-- Track Data Pellets -->
  <g fill="#ffdd54" filter="url(#neonG)">
    <!-- Upper Lane Pellets -->
    <circle cx="60" cy="90" r="3.5" class="d1" />
    <circle cx="100" cy="90" r="3.5" class="d1" />
    <circle cx="140" cy="90" r="3.5" class="d2" />
    <circle cx="180" cy="90" r="3.5" class="d2" />
    <circle cx="220" cy="90" r="3.5" class="d3" />
    <circle cx="260" cy="90" r="3.5" class="d3" />
    <circle cx="300" cy="90" r="3.5" class="d4" />
    <circle cx="340" cy="90" r="3.5" class="d4" />
    <circle cx="380" cy="90" r="3.5" class="d5" />
    
    <!-- Big Power Energizer Pellet at Corner -->
    <circle cx="430" cy="90" class="power-dot d5" />

    <!-- Turn Column Pellets -->
    <circle cx="430" cy="115" r="3.5" class="d6" />
    <circle cx="430" cy="140" r="3.5" class="d6" />

    <!-- Lower Lane Pellets -->
    <circle cx="475" cy="140" r="3.5" class="d7" />
    <circle cx="515" cy="140" r="3.5" class="d7" />
    <circle cx="555" cy="140" r="3.5" class="d8" />
    <circle cx="595" cy="140" r="3.5" class="d8" />
    <circle cx="635" cy="140" r="3.5" class="d9" />
    <circle cx="675" cy="140" r="3.5" class="d9" />
    <circle cx="715" cy="140" r="3.5" class="d10" />
    <circle cx="755" cy="140" r="3.5" class="d10" />
    <circle cx="795" cy="140" class="power-dot d10" />
    <circle cx="835" cy="140" r="3.5" class="d10" />
  </g>

  <!-- Authentic Pacman Actor (Flawless SVG Cutout Geometry) -->
  <g class="pacman-actor">
    <g filter="url(#strongG)">
      <!-- Solid Yellow Circle Body -->
      <circle cx="0" cy="0" r="14" fill="#FFD700" />
      
      <!-- Mouth Wedge (Animated ScaleY Cutout) -->
      <polygon points="0,0 16,-10 16,10" fill="#080d16" class="mouth" />
      
      <!-- Pacman Eye -->
      <circle cx="1" cy="-7" r="2.2" fill="#020408" />
    </g>
  </g>

  <!-- Authentic Retro Ghost Sprite Actor (Blinky / Inky) -->
  <g class="ghost-actor">
    <g class="ghost-motion" filter="url(#strongG)">
      <!-- Ghost Head & Tentacle Body (Single Perfect Smooth Path) -->
      <path class="ghost-color" d="M -12,0 A 12,12 0 0,1 12,0 L 12,11 L 8,8 L 4,11 L 0,8 L -4,11 L -8,8 L -12,11 Z" />
      
      <!-- Sclera Eyes -->
      <ellipse cx="-4" cy="-2" rx="3.5" ry="4.5" fill="#ffffff" />
      <ellipse cx="4" cy="-2" rx="3.5" ry="4.5" fill="#ffffff" />
      
      <!-- Pupils Tracking Right -->
      <circle cx="-2.5" cy="-2" r="2" fill="#00f0ff" />
      <circle cx="5.5" cy="-2" r="2" fill="#00f0ff" />
    </g>
  </g>

  <!-- Bottom Console Status Bar -->
  <g transform="translate(25, 192)">
    <text x="0" y="0" fill="#8b949e" class="hud-text" font-size="9.5px">RAW_FRAME: 802.11 BEACON  |  MAC: DE:AD:BE:EF:CA:FE  |  ESP32_SNIFFER: ACTIVE</text>
  </g>
</svg>

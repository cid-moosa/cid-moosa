<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 170" width="100%" height="100%">
  <defs>
    <!-- Dark Background Gradient -->
    <linearGradient id="crtBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#03060a" />
      <stop offset="50%" stop-color="#080e18" />
      <stop offset="100%" stop-color="#020408" />
    </linearGradient>

    <!-- Glowing Filters -->
    <filter id="neonG" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="2" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>

    <filter id="goldGlow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="3" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>

    <!-- Grid Pattern -->
    <pattern id="dotMatrix" width="20" height="20" patternUnits="userSpaceOnUse">
      <circle cx="10" cy="10" r="1" fill="#00ff66" fill-opacity="0.1" />
    </pattern>
  </defs>

  <style>
    /* Smooth Continuous Linear Horizontal Movement */
    @keyframes pacmanRun {
      0% { transform: translateX(-40px); }
      100% { transform: translateX(920px); }
    }
    @keyframes ghostRun {
      0% { transform: translateX(-120px); }
      100% { transform: translateX(840px); }
    }
    @keyframes ghost2Run {
      0% { transform: translateX(-170px); }
      100% { transform: translateX(790px); }
    }

    /* Flawless Mouth Chomp (Wedge Scale) */
    @keyframes chompTop {
      0%, 100% { transform: rotate(0deg); }
      50% { transform: rotate(-30deg); }
    }
    @keyframes chompBot {
      0%, 100% { transform: rotate(0deg); }
      50% { transform: rotate(30deg); }
    }

    /* Continuous Dot Waves (Disappear as Pacman passes) */
    @keyframes dotCycle {
      0%, 10% { opacity: 0.1; }
      15%, 100% { opacity: 1; }
    }

    /* Scanline */
    @keyframes scanlineBeam {
      0% { transform: translateY(-10px); }
      100% { transform: translateY(180px); }
    }

    .pacman-sprite { animation: pacmanRun 6s linear infinite; }
    .ghost-sprite { animation: ghostRun 6s linear infinite; }
    .ghost2-sprite { animation: ghost2Run 6s linear infinite; }

    .jaw-top { transform-origin: 0px 0px; animation: chompTop 0.25s infinite linear; }
    .jaw-bot { transform-origin: 0px 0px; animation: chompBot 0.25s infinite linear; }

    .dot-flash { animation: dotCycle 6s linear infinite; }
    .scan-laser { animation: scanlineBeam 3s linear infinite; }

    .arcade-font {
      font-family: 'Courier New', 'SF Mono', 'Fira Code', monospace;
      font-weight: 900;
      font-size: 11px;
      letter-spacing: 2px;
    }
  </style>

  <!-- Frame Background -->
  <rect width="880" height="170" rx="10" fill="url(#crtBg)" stroke="#30363d" stroke-width="1.5" />
  <rect width="880" height="170" rx="10" fill="url(#dotMatrix)" />

  <!-- Scanline Simulation -->
  <g class="scan-laser" opacity="0.08">
    <rect x="0" y="0" width="880" height="15" fill="#00ff66" />
  </g>

  <!-- Arcade HUD Score Header -->
  <g transform="translate(25, 24)">
    <text x="0" y="0" fill="#00ff66" class="arcade-font" filter="url(#neonG)">HIGH_SCORE: 133,700</text>
    <text x="240" y="0" fill="#00f0ff" class="arcade-font">MODE: 802.11 PACKET_SNIFFER</text>
    <text x="560" y="0" fill="#ffdd54" class="arcade-font">LEVEL: SIGINT_LAB</text>
    <text x="760" y="0" fill="#ff0055" class="arcade-font">LIVES: 3</text>
  </g>

  <!-- Neon Blue Cyber Rails -->
  <g fill="none" stroke="#00f0ff" stroke-width="2" filter="url(#neonG)" opacity="0.7">
    <line x1="20" y1="48" x2="860" y2="48" />
    <line x1="20" y1="135" x2="860" y2="135" />
  </g>

  <!-- Track Data Pellets (Synchronized Spacing) -->
  <g fill="#ffdd54" filter="url(#neonG)" transform="translate(0, 92)">
    <circle cx="40" cy="0" r="3.5" class="dot-flash" style="animation-delay: 0.2s;" />
    <circle cx="80" cy="0" r="3.5" class="dot-flash" style="animation-delay: 0.5s;" />
    <circle cx="120" cy="0" r="3.5" class="dot-flash" style="animation-delay: 0.8s;" />
    <circle cx="160" cy="0" r="3.5" class="dot-flash" style="animation-delay: 1.1s;" />
    <circle cx="200" cy="0" r="6" fill="#00ff66" class="dot-flash" style="animation-delay: 1.3s;" filter="url(#goldGlow)" />
    <circle cx="240" cy="0" r="3.5" class="dot-flash" style="animation-delay: 1.6s;" />
    <circle cx="280" cy="0" r="3.5" class="dot-flash" style="animation-delay: 1.8s;" />
    <circle cx="320" cy="0" r="3.5" class="dot-flash" style="animation-delay: 2.1s;" />
    <circle cx="360" cy="0" r="3.5" class="dot-flash" style="animation-delay: 2.4s;" />
    <circle cx="400" cy="0" r="3.5" class="dot-flash" style="animation-delay: 2.6s;" />
    <circle cx="440" cy="0" r="6" fill="#ff0055" class="dot-flash" style="animation-delay: 2.9s;" filter="url(#goldGlow)" />
    <circle cx="480" cy="0" r="3.5" class="dot-flash" style="animation-delay: 3.2s;" />
    <circle cx="520" cy="0" r="3.5" class="dot-flash" style="animation-delay: 3.5s;" />
    <circle cx="560" cy="0" r="3.5" class="dot-flash" style="animation-delay: 3.7s;" />
    <circle cx="600" cy="0" r="3.5" class="dot-flash" style="animation-delay: 4.0s;" />
    <circle cx="640" cy="0" r="3.5" class="dot-flash" style="animation-delay: 4.3s;" />
    <circle cx="680" cy="0" r="6" fill="#00f0ff" class="dot-flash" style="animation-delay: 4.5s;" filter="url(#goldGlow)" />
    <circle cx="720" cy="0" r="3.5" class="dot-flash" style="animation-delay: 4.8s;" />
    <circle cx="760" cy="0" r="3.5" class="dot-flash" style="animation-delay: 5.1s;" />
    <circle cx="800" cy="0" r="3.5" class="dot-flash" style="animation-delay: 5.3s;" />
    <circle cx="840" cy="0" r="3.5" class="dot-flash" style="animation-delay: 5.6s;" />
  </g>

  <!-- Pacman Actor (Smooth 60fps Linear Track) -->
  <g class="pacman-sprite" transform="translate(0, 92)">
    <g filter="url(#goldGlow)">
      <!-- Top Jaw Arc -->
      <path d="M 0,0 L 14,-3 A 14,14 0 0,0 -14,0 L 0,0 Z" fill="#ffd700" class="jaw-top" />
      <!-- Bottom Jaw Arc -->
      <path d="M 0,0 L 14,3 A 14,14 0 0,1 -14,0 L 0,0 Z" fill="#ffd700" class="jaw-bot" />
      <!-- Left Body Connector -->
      <circle cx="-3" cy="0" r="11" fill="#ffd700" />
      <!-- Eye -->
      <circle cx="1" cy="-7" r="2.2" fill="#020408" />
    </g>
  </g>

  <!-- Red Ghost Chaser (Blinky) -->
  <g class="ghost-sprite" transform="translate(0, 92)">
    <g filter="url(#neonG)">
      <path d="M -12,-3 A 12,12 0 0,1 12,-3 L 12,10 L 8,7 L 4,10 L 0,7 L -4,10 L -8,7 L -12,10 Z" fill="#ff0055" />
      <!-- Sclera Eyes -->
      <ellipse cx="-4" cy="-4" rx="3.5" ry="4.5" fill="#ffffff" />
      <ellipse cx="4" cy="-4" rx="3.5" ry="4.5" fill="#ffffff" />
      <!-- Blue Pupils looking right -->
      <circle cx="-2" cy="-4" r="2" fill="#00f0ff" />
      <circle cx="6" cy="-4" r="2" fill="#00f0ff" />
    </g>
  </g>

  <!-- Cyan Ghost Chaser (Inky) -->
  <g class="ghost2-sprite" transform="translate(0, 92)">
    <g filter="url(#neonG)">
      <path d="M -12,-3 A 12,12 0 0,1 12,-3 L 12,10 L 8,7 L 4,10 L 0,7 L -4,10 L -8,7 L -12,10 Z" fill="#00f0ff" />
      <!-- Sclera Eyes -->
      <ellipse cx="-4" cy="-4" rx="3.5" ry="4.5" fill="#ffffff" />
      <ellipse cx="4" cy="-4" rx="3.5" ry="4.5" fill="#ffffff" />
      <!-- Dark Blue Pupils looking right -->
      <circle cx="-2" cy="-4" r="2" fill="#020408" />
      <circle cx="6" cy="-4" r="2" fill="#020408" />
    </g>
  </g>

  <!-- Bottom Console Status Bar -->
  <g transform="translate(25, 155)">
    <text x="0" y="0" fill="#8b949e" class="arcade-font" font-size="9.5px">RAW_FRAME: 802.11 BEACON  |  MAC: DE:AD:BE:EF:CA:FE  |  ESP32_SNIFFER: ACTIVE  |  SPEED: 60 FPS</text>
  </g>
</svg>

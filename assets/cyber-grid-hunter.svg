<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 170" width="100%" height="100%">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="scopeBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0a0e14" />
      <stop offset="50%" stop-color="#0d1117" />
      <stop offset="100%" stop-color="#080c10" />
    </linearGradient>

    <!-- Top Chrome Bar -->
    <linearGradient id="scopeChrome" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#161b22" />
      <stop offset="100%" stop-color="#0f141a" />
    </linearGradient>
  </defs>

  <style>
    @keyframes pulseDot {
      0%, 100% { opacity: 1; }
      50% { opacity: 0.35; }
    }
    @keyframes sweepPlayhead {
      0% { transform: translateX(170px); opacity: 0; }
      4% { opacity: 0.95; }
      92% { opacity: 0.95; }
      98%, 100% { transform: translateX(815px); opacity: 0; }
    }
    .status-dot {
      animation: pulseDot 2.2s ease-in-out infinite;
    }
    .playhead-sweep {
      animation: sweepPlayhead 4.2s cubic-bezier(0.25, 0.1, 0.25, 1) infinite;
    }
    .mono-hdr {
      font-family: 'SF Mono', 'Cascadia Code', 'Fira Code', 'Consolas', monospace;
      font-size: 10px;
      font-weight: 700;
      letter-spacing: 1.2px;
      fill: #f0f6fc;
    }
    .mono-meta {
      font-family: 'SF Mono', 'Cascadia Code', 'Fira Code', 'Consolas', monospace;
      font-size: 9px;
      letter-spacing: 0.8px;
      fill: #7d8590;
    }
    .ch-label {
      font-family: 'SF Mono', 'Cascadia Code', 'Fira Code', 'Consolas', monospace;
      font-size: 9px;
      font-weight: 700;
      letter-spacing: 0.5px;
    }
    .pkt-text {
      font-family: 'SF Mono', 'Cascadia Code', 'Fira Code', 'Consolas', monospace;
      font-size: 8px;
      font-weight: 600;
      letter-spacing: 0.5px;
      fill: #c9d1d9;
    }
    .cursor-text {
      font-family: 'SF Mono', 'Cascadia Code', 'Fira Code', monospace;
      font-size: 8px;
      fill: #e3b341;
      letter-spacing: 0.5px;
    }
  </style>

  <!-- Base Card Frame -->
  <rect width="880" height="170" rx="8" fill="url(#scopeBg)" stroke="#21262d" stroke-width="1" />

  <!-- Top System Header -->
  <rect width="880" height="30" rx="8" fill="url(#scopeChrome)" />
  <rect y="22" width="880" height="8" fill="url(#scopeChrome)" />
  <line x1="0" y1="30" x2="880" y2="30" stroke="#21262d" stroke-width="1" />

  <!-- Header Content -->
  <circle cx="18" cy="15" r="3" fill="#3fb950" class="status-dot" />
  <text x="28" y="19" class="mono-hdr">LOGIC ANALYZER // HARDWARE BUS CAPTURE [SPI / UART / 802.11]</text>
  <text x="862" y="19" text-anchor="end" class="mono-meta">SAMPLE: <tspan fill="#38bdf8">100 MSPS</tspan> | 3.3V TTL | DECODER: <tspan fill="#3fb950">LOCKED</tspan></text>

  <!-- Vertical Timing Grid Divisions -->
  <g stroke="#161b22" stroke-width="1">
    <line x1="170" y1="30" x2="170" y2="162" />
    <line x1="298" y1="30" x2="298" y2="162" />
    <line x1="426" y1="30" x2="426" y2="162" />
    <line x1="554" y1="30" x2="554" y2="162" />
    <line x1="682" y1="30" x2="682" y2="162" />
    <line x1="810" y1="30" x2="810" y2="162" />
  </g>

  <!-- Channel Baselines & Track Separation -->
  <line x1="14" y1="64" x2="866" y2="64" stroke="#161b22" stroke-width="0.8" />
  <line x1="14" y1="96" x2="866" y2="96" stroke="#161b22" stroke-width="0.8" />
  <line x1="14" y1="128" x2="866" y2="128" stroke="#161b22" stroke-width="0.8" />

  <!-- ==================== CH0: SPI CLOCK ==================== -->
  <text x="18" y="52" class="ch-label" fill="#58a6ff">CH0 [SCK]</text>
  <!-- Synchronous 39-cycle clock square wave -->
  <path d="M 120 56 L 170 56 L 170 44 L 178 44 L 178 56 L 186 56 L 186 44 L 194 44 L 194 56 L 202 56 L 202 44 L 210 44 L 210 56 L 218 56 L 218 44 L 226 44 L 226 56 L 234 56 L 234 44 L 242 44 L 242 56 L 250 56 L 250 44 L 258 44 L 258 56 L 266 56 L 266 44 L 274 44 L 274 56 L 282 56 L 282 44 L 290 44 L 290 56 L 298 56 L 298 44 L 306 44 L 306 56 L 314 56 L 314 44 L 322 44 L 322 56 L 330 56 L 330 44 L 338 44 L 338 56 L 346 56 L 346 44 L 354 44 L 354 56 L 362 56 L 362 44 L 370 44 L 370 56 L 378 56 L 378 44 L 386 44 L 386 56 L 394 56 L 394 44 L 402 44 L 402 56 L 410 56 L 410 44 L 418 44 L 418 56 L 426 56 L 426 44 L 434 44 L 434 56 L 442 56 L 442 44 L 450 44 L 450 56 L 458 56 L 458 44 L 466 44 L 466 56 L 474 56 L 474 44 L 482 44 L 482 56 L 490 56 L 490 44 L 498 44 L 498 56 L 506 56 L 506 44 L 514 44 L 514 56 L 522 56 L 522 44 L 530 44 L 530 56 L 538 56 L 538 44 L 546 44 L 546 56 L 554 56 L 554 44 L 562 44 L 562 56 L 570 56 L 570 44 L 578 44 L 578 56 L 586 56 L 586 44 L 594 44 L 594 56 L 602 56 L 602 44 L 610 44 L 610 56 L 618 56 L 618 44 L 626 44 L 626 56 L 634 56 L 634 44 L 642 44 L 642 56 L 650 56 L 650 44 L 658 44 L 658 56 L 666 56 L 666 44 L 674 44 L 674 56 L 682 56 L 682 44 L 690 44 L 690 56 L 698 56 L 698 44 L 706 44 L 706 56 L 714 56 L 714 44 L 722 44 L 722 56 L 730 56 L 730 44 L 738 44 L 738 56 L 746 56 L 746 44 L 754 44 L 754 56 L 762 56 L 762 44 L 770 44 L 770 56 L 778 56 L 778 44 L 786 44 L 786 56 L 794 56 L 860 56" fill="none" stroke="#58a6ff" stroke-width="1.3" />

  <!-- ==================== CH1: MOSI (COMMAND & ADDR) ==================== -->
  <text x="18" y="84" class="ch-label" fill="#38bdf8">CH1 [MOSI]</text>
  <!-- Waveform: 0x03 (0000 0011), 0x00, 0x40 (0100 0000), 0x00 -->
  <path d="M 120 88 L 266 88 L 266 74 L 298 74 L 298 88 L 442 88 L 442 74 L 458 74 L 458 88 L 860 88" fill="none" stroke="#38bdf8" stroke-width="1.4" />
  <!-- Decoded Protocol Packets for MOSI -->
  <g transform="translate(0, 0)">
    <rect x="174" y="66" width="118" height="11" rx="2" fill="#161b22" stroke="#38bdf8" stroke-width="0.8" />
    <text x="233" y="75" text-anchor="middle" class="pkt-text">CMD: 0x03 [READ]</text>

    <rect x="302" y="66" width="118" height="11" rx="2" fill="#161b22" stroke="#30363d" stroke-width="0.8" />
    <text x="361" y="75" text-anchor="middle" class="pkt-text" fill="#8b949e">ADDR[23:16]: 0x00</text>

    <rect x="430" y="66" width="118" height="11" rx="2" fill="#161b22" stroke="#38bdf8" stroke-width="0.8" />
    <text x="489" y="75" text-anchor="middle" class="pkt-text">ADDR[15:8]: 0x40</text>

    <rect x="558" y="66" width="118" height="11" rx="2" fill="#161b22" stroke="#30363d" stroke-width="0.8" />
    <text x="617" y="75" text-anchor="middle" class="pkt-text" fill="#8b949e">ADDR[7:0]: 0x00</text>
  </g>

  <!-- ==================== CH2: MISO (PAYLOAD RESPONSE) ==================== -->
  <text x="18" y="116" class="ch-label" fill="#3fb950">CH2 [MISO]</text>
  <!-- Hi-Z until 682, then transmits 0x7F (0111 1111) and 0x45 (0100 0101) -->
  <path d="M 120 120 L 682 120 L 698 120 L 698 106 L 810 106 L 810 120 L 860 120" fill="none" stroke="#3fb950" stroke-width="1.4" />
  <!-- Decoded Protocol Packets for MISO -->
  <g transform="translate(0, 0)">
    <rect x="174" y="98" width="502" height="11" rx="2" fill="#10141a" stroke="#21262d" stroke-width="0.6" stroke-dasharray="3,3" />
    <text x="425" y="107" text-anchor="middle" class="pkt-text" fill="#484f58">BUS HIGH-IMPEDANCE [HI-Z] // COMMAND &amp; ADDRESSING PHASE</text>

    <rect x="686" y="98" width="118" height="11" rx="2" fill="#16231c" stroke="#3fb950" stroke-width="0.8" />
    <text x="745" y="107" text-anchor="middle" class="pkt-text" fill="#3fb950">DATA: 0x7F 0x45 [ELF]</text>
  </g>

  <!-- ==================== CH3: CS# (ACTIVE LOW CHIP SELECT) ==================== -->
  <text x="18" y="148" class="ch-label" fill="#e3b341">CH3 [CS#]</text>
  <!-- Held HIGH at 138, asserts LOW at 155 to 150, rises at 815 -->
  <path d="M 120 138 L 155 138 L 155 150 L 815 150 L 815 138 L 860 138" fill="none" stroke="#e3b341" stroke-width="1.4" />
  <!-- State tags for CS# -->
  <text x="140" y="146" text-anchor="end" class="pkt-text" fill="#8b949e">HIGH</text>
  <text x="165" y="159" class="pkt-text" fill="#e3b341">[ASSERT: TRANSACTION ACTIVE]</text>
  <text x="822" y="146" class="pkt-text" fill="#8b949e">IDLE</text>

  <!-- ==================== TIMING CURSORS & DELTA ==================== -->
  <line x1="170" y1="30" x2="170" y2="162" stroke="#e3b341" stroke-width="0.8" stroke-dasharray="2,2" opacity="0.75" />
  <rect x="172" y="32" width="62" height="11" rx="2" fill="#161b22" />
  <text x="175" y="41" class="cursor-text">T1: 0.00 μs</text>

  <line x1="682" y1="30" x2="682" y2="162" stroke="#38bdf8" stroke-width="0.8" stroke-dasharray="2,2" opacity="0.75" />
  <rect x="684" y="32" width="115" height="11" rx="2" fill="#161b22" />
  <text x="687" y="41" class="cursor-text" fill="#38bdf8">T2: +5.12 μs [Δ: 5.12μs]</text>

  <!-- Live Sweeping Logic Analyzer Playhead Cursor -->
  <g class="playhead-sweep">
    <line x1="0" y1="30" x2="0" y2="162" stroke="#38bdf8" stroke-width="1.2" stroke-dasharray="3,1" opacity="0.9" />
    <polygon points="-3.5,30 3.5,30 0,35" fill="#38bdf8" />
    <circle cx="0" cy="162" r="2" fill="#38bdf8" />
  </g>
</svg>

<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 170" width="100%" height="100%">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="crtBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#03060a" />
      <stop offset="50%" stop-color="#080e18" />
      <stop offset="100%" stop-color="#020408" />
    </linearGradient>

    <!-- Glowing Filters -->
    <filter id="neonG" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="2" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>

    <filter id="goldGlow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="3" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>

    <!-- Grid Pattern -->
    <pattern id="dotMatrix" width="20" height="20" patternUnits="userSpaceOnUse">
      <circle cx="10" cy="10" r="1" fill="#00ff66" fill-opacity="0.1" />
    </pattern>
  </defs>

  <style>
    .arcade-font {
      font-family: 'Courier New', 'SF Mono', 'Fira Code', monospace;
      font-weight: 900;
      font-size: 11px;
      letter-spacing: 2px;
    }
  </style>

  <!-- Frame Background -->
  <rect width="880" height="170" rx="10" fill="url(#crtBg)" stroke="#30363d" stroke-width="1.5" />
  <rect width="880" height="170" rx="10" fill="url(#dotMatrix)" />

  <!-- CRT Scanline Simulation -->
  <g opacity="0.08">
    <rect x="0" y="0" width="880" height="15" fill="#00ff66">
      <animateTransform attributeName="transform" type="translate" from="0 -10" to="0 180" dur="3s" repeatCount="indefinite" />
    </rect>
  </g>

  <!-- Arcade HUD Score Header -->
  <g transform="translate(25, 24)">
    <text x="0" y="0" fill="#00ff66" class="arcade-font" filter="url(#neonG)">HIGH_SCORE: 133,700</text>
    <text x="240" y="0" fill="#00f0ff" class="arcade-font">MODE: 802.11 PACKET_SNIFFER</text>
    <text x="560" y="0" fill="#ffdd54" class="arcade-font">LEVEL: SIGINT_LAB</text>
    <text x="760" y="0" fill="#ff0055" class="arcade-font">LIVES: 3</text>
  </g>

  <!-- Neon Blue Cyber Rails -->
  <g fill="none" stroke="#00f0ff" stroke-width="2" filter="url(#neonG)" opacity="0.7">
    <line x1="20" y1="48" x2="860" y2="48" />
    <line x1="20" y1="135" x2="860" y2="135" />
  </g>

  <!-- Track Data Pellets with Guaranteed Discrete Radius & Visibility Removal -->
  <g fill="#ffdd54" filter="url(#neonG)" transform="translate(0, 92)">
    <!-- Pellet 1: cx = 40 (chomped at t = 0.083) -->
    <circle cx="40" cy="0" r="3.5">
      <animate attributeName="r" calcMode="discrete" values="3.5; 0" keyTimes="0; 0.083" dur="6s" repeatCount="indefinite" />
      <animate attributeName="visibility" calcMode="discrete" values="visible; hidden" keyTimes="0; 0.083" dur="6s" repeatCount="indefinite" />
    </circle>

    <!-- Pellet 2: cx = 90 (chomped at t = 0.135) -->
    <circle cx="90" cy="0" r="3.5">
      <animate attributeName="r" calcMode="discrete" values="3.5; 0" keyTimes="0; 0.135" dur="6s" repeatCount="indefinite" />
      <animate attributeName="visibility" calcMode="discrete" values="visible; hidden" keyTimes="0; 0.135" dur="6s" repeatCount="indefinite" />
    </circle>

    <!-- Pellet 3: cx = 140 (chomped at t = 0.187) -->
    <circle cx="140" cy="0" r="3.5">
      <animate attributeName="r" calcMode="discrete" values="3.5; 0" keyTimes="0; 0.187" dur="6s" repeatCount="indefinite" />
      <animate attributeName="visibility" calcMode="discrete" values="visible; hidden" keyTimes="0; 0.187" dur="6s" repeatCount="indefinite" />
    </circle>

    <!-- Power Pellet 1: cx = 190 (chomped at t = 0.240) -->
    <circle cx="190" cy="0" r="6.5" fill="#00ff66" filter="url(#goldGlow)">
      <animate attributeName="r" calcMode="discrete" values="6.5; 0" keyTimes="0; 0.240" dur="6s" repeatCount="indefinite" />
      <animate attributeName="visibility" calcMode="discrete" values="visible; hidden" keyTimes="0; 0.240" dur="6s" repeatCount="indefinite" />
    </circle>

    <!-- Pellet 5: cx = 240 (chomped at t = 0.292) -->
    <circle cx="240" cy="0" r="3.5">
      <animate attributeName="r" calcMode="discrete" values="3.5; 0" keyTimes="0; 0.292" dur="6s" repeatCount="indefinite" />
      <animate attributeName="visibility" calcMode="discrete" values="visible; hidden" keyTimes="0; 0.292" dur="6s" repeatCount="indefinite" />
    </circle>

    <!-- Pellet 6: cx = 290 (chomped at t = 0.344) -->
    <circle cx="290" cy="0" r="3.5">
      <animate attributeName="r" calcMode="discrete" values="3.5; 0" keyTimes="0; 0.344" dur="6s" repeatCount="indefinite" />
      <animate attributeName="visibility" calcMode="discrete" values="visible; hidden" keyTimes="0; 0.344" dur="6s" repeatCount="indefinite" />
    </circle>

    <!-- Pellet 7: cx = 340 (chomped at t = 0.396) -->
    <circle cx="340" cy="0" r="3.5">
      <animate attributeName="r" calcMode="discrete" values="3.5; 0" keyTimes="0; 0.396" dur="6s" repeatCount="indefinite" />
      <animate attributeName="visibility" calcMode="discrete" values="visible; hidden" keyTimes="0; 0.396" dur="6s" repeatCount="indefinite" />
    </circle>

    <!-- Pellet 8: cx = 390 (chomped at t = 0.448) -->
    <circle cx="390" cy="0" r="3.5">
      <animate attributeName="r" calcMode="discrete" values="3.5; 0" keyTimes="0; 0.448" dur="6s" repeatCount="indefinite" />
      <animate attributeName="visibility" calcMode="discrete" values="visible; hidden" keyTimes="0; 0.448" dur="6s" repeatCount="indefinite" />
    </circle>

    <!-- Power Pellet 2: cx = 440 (chomped at t = 0.500) -->
    <circle cx="440" cy="0" r="6.5" fill="#ff0055" filter="url(#goldGlow)">
      <animate attributeName="r" calcMode="discrete" values="6.5; 0" keyTimes="0; 0.500" dur="6s" repeatCount="indefinite" />
      <animate attributeName="visibility" calcMode="discrete" values="visible; hidden" keyTimes="0; 0.500" dur="6s" repeatCount="indefinite" />
    </circle>

    <!-- Pellet 10: cx = 490 (chomped at t = 0.552) -->
    <circle cx="490" cy="0" r="3.5">
      <animate attributeName="r" calcMode="discrete" values="3.5; 0" keyTimes="0; 0.552" dur="6s" repeatCount="indefinite" />
      <animate attributeName="visibility" calcMode="discrete" values="visible; hidden" keyTimes="0; 0.552" dur="6s" repeatCount="indefinite" />
    </circle>

    <!-- Pellet 11: cx = 540 (chomped at t = 0.604) -->
    <circle cx="540" cy="0" r="3.5">
      <animate attributeName="r" calcMode="discrete" values="3.5; 0" keyTimes="0; 0.604" dur="6s" repeatCount="indefinite" />
      <animate attributeName="visibility" calcMode="discrete" values="visible; hidden" keyTimes="0; 0.604" dur="6s" repeatCount="indefinite" />
    </circle>

    <!-- Pellet 12: cx = 590 (chomped at t = 0.656) -->
    <circle cx="590" cy="0" r="3.5">
      <animate attributeName="r" calcMode="discrete" values="3.5; 0" keyTimes="0; 0.656" dur="6s" repeatCount="indefinite" />
      <animate attributeName="visibility" calcMode="discrete" values="visible; hidden" keyTimes="0; 0.656" dur="6s" repeatCount="indefinite" />
    </circle>

    <!-- Pellet 13: cx = 640 (chomped at t = 0.708) -->
    <circle cx="640" cy="0" r="3.5">
      <animate attributeName="r" calcMode="discrete" values="3.5; 0" keyTimes="0; 0.708" dur="6s" repeatCount="indefinite" />
      <animate attributeName="visibility" calcMode="discrete" values="visible; hidden" keyTimes="0; 0.708" dur="6s" repeatCount="indefinite" />
    </circle>

    <!-- Power Pellet 3: cx = 690 (chomped at t = 0.760) -->
    <circle cx="690" cy="0" r="6.5" fill="#00f0ff" filter="url(#goldGlow)">
      <animate attributeName="r" calcMode="discrete" values="6.5; 0" keyTimes="0; 0.760" dur="6s" repeatCount="indefinite" />
      <animate attributeName="visibility" calcMode="discrete" values="visible; hidden" keyTimes="0; 0.760" dur="6s" repeatCount="indefinite" />
    </circle>

    <!-- Pellet 15: cx = 740 (chomped at t = 0.812) -->
    <circle cx="740" cy="0" r="3.5">
      <animate attributeName="r" calcMode="discrete" values="3.5; 0" keyTimes="0; 0.812" dur="6s" repeatCount="indefinite" />
      <animate attributeName="visibility" calcMode="discrete" values="visible; hidden" keyTimes="0; 0.812" dur="6s" repeatCount="indefinite" />
    </circle>

    <!-- Pellet 16: cx = 790 (chomped at t = 0.865) -->
    <circle cx="790" cy="0" r="3.5">
      <animate attributeName="r" calcMode="discrete" values="3.5; 0" keyTimes="0; 0.865" dur="6s" repeatCount="indefinite" />
      <animate attributeName="visibility" calcMode="discrete" values="visible; hidden" keyTimes="0; 0.865" dur="6s" repeatCount="indefinite" />
    </circle>

    <!-- Pellet 17: cx = 840 (chomped at t = 0.917) -->
    <circle cx="840" cy="0" r="3.5">
      <animate attributeName="r" calcMode="discrete" values="3.5; 0" keyTimes="0; 0.917" dur="6s" repeatCount="indefinite" />
      <animate attributeName="visibility" calcMode="discrete" values="visible; hidden" keyTimes="0; 0.917" dur="6s" repeatCount="indefinite" />
    </circle>
  </g>

  <!-- Pacman Actor (Smooth Native Path Morph Chomp) -->
  <g>
    <animateTransform attributeName="transform" type="translate" from="-40 92" to="920 92" dur="6s" repeatCount="indefinite" />
    
    <g filter="url(#goldGlow)">
      <!-- Morphing Mouth Arc (Mouth Closed -> Open -> Closed) -->
      <path fill="#ffd700">
        <animate attributeName="d" dur="0.25s" repeatCount="indefinite"
          values="M 0,0 L 14,-1 A 14,14 0 1,0 14,1 Z;
                  M 0,0 L 11,-9 A 14,14 0 1,0 11,9 Z;
                  M 0,0 L 14,-1 A 14,14 0 1,0 14,1 Z" />
      </path>
      <!-- Pacman Eye -->
      <circle cx="1" cy="-7" r="2.2" fill="#020408" />
    </g>
  </g>

  <!-- Blinky (Red Ghost Chaser) -->
  <g>
    <animateTransform attributeName="transform" type="translate" from="-120 92" to="840 92" dur="6s" repeatCount="indefinite" />
    
    <g filter="url(#neonG)">
      <!-- Animated Floating Body -->
      <g>
        <animateTransform attributeName="transform" type="translate" values="0 0; 0 -3; 0 0" dur="0.4s" repeatCount="indefinite" />
        <path d="M -12,-3 A 12,12 0 0,1 12,-3 L 12,10 L 8,7 L 4,10 L 0,7 L -4,10 L -8,7 L -12,10 Z" fill="#ff0055" />
        <!-- Eyes -->
        <ellipse cx="-4" cy="-4" rx="3.5" ry="4.5" fill="#ffffff" />
        <ellipse cx="4" cy="-4" rx="3.5" ry="4.5" fill="#ffffff" />
        <circle cx="-2" cy="-4" r="2" fill="#00f0ff" />
        <circle cx="6" cy="-4" r="2" fill="#00f0ff" />
      </g>
    </g>
  </g>

  <!-- Inky (Cyan Ghost Chaser) -->
  <g>
    <animateTransform attributeName="transform" type="translate" from="-170 92" to="790 92" dur="6s" repeatCount="indefinite" />
    
    <g filter="url(#neonG)">
      <!-- Animated Floating Body with Phase Offset -->
      <g>
        <animateTransform attributeName="transform" type="translate" values="0 -3; 0 0; 0 -3" dur="0.4s" repeatCount="indefinite" />
        <path d="M -12,-3 A 12,12 0 0,1 12,-3 L 12,10 L 8,7 L 4,10 L 0,7 L -4,10 L -8,7 L -12,10 Z" fill="#00f0ff" />
        <!-- Eyes -->
        <ellipse cx="-4" cy="-4" rx="3.5" ry="4.5" fill="#ffffff" />
        <ellipse cx="4" cy="-4" rx="3.5" ry="4.5" fill="#ffffff" />
        <circle cx="-2" cy="-4" r="2" fill="#020408" />
        <circle cx="6" cy="-4" r="2" fill="#020408" />
      </g>
    </g>
  </g>

  <!-- Bottom Console Status Bar -->
  <g transform="translate(25, 155)">
    <text x="0" y="0" fill="#8b949e" class="arcade-font" font-size="9.5px">RAW_FRAME: 802.11 BEACON  |  MAC: DE:AD:BE:EF:CA:FE  |  ESP32_SNIFFER: ACTIVE  |  HARDWARE_SMIL: 60 FPS</text>
  </g>
</svg>

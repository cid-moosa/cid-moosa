<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 110" width="100%" height="100%">
  <defs>
    <linearGradient id="footerBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#05080c" />
      <stop offset="50%" stop-color="#0d1117" />
      <stop offset="100%" stop-color="#080b10" />
    </linearGradient>

    <linearGradient id="neonGlow" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#00ff66" />
      <stop offset="50%" stop-color="#00f0ff" />
      <stop offset="100%" stop-color="#7000ff" />
    </linearGradient>

    <filter id="glowF" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>

    <pattern id="footerGrid" width="20" height="20" patternUnits="userSpaceOnUse">
      <path d="M 20 0 L 0 0 0 20" fill="none" stroke="#00f0ff" stroke-width="0.5" stroke-opacity="0.06" />
    </pattern>
  </defs>

  <style>
    @keyframes pulseF {
      0%, 100% { opacity: 0.7; }
      50% { opacity: 1; filter: drop-shadow(0 0 10px rgba(0,255,102,0.8)); }
    }
    @keyframes waveF {
      0% { transform: translateX(0); }
      100% { transform: translateX(-450px); }
    }
    .footer-text {
      font-family: 'SF Mono', 'Fira Code', 'Cascadia Code', monospace;
      font-weight: 700;
      font-size: 13px;
      letter-spacing: 3px;
      fill: url(#neonGlow);
      animation: pulseF 3s ease-in-out infinite;
    }
    .footer-sub {
      font-family: 'SF Mono', 'Fira Code', monospace;
      font-size: 11px;
      fill: #8b949e;
      letter-spacing: 1.5px;
    }
    .wave-line {
      animation: waveF 8s linear infinite;
    }
  </style>

  <rect width="900" height="110" rx="12" fill="url(#footerBg)" stroke="#30363d" stroke-width="1.5" />
  <rect width="900" height="110" rx="12" fill="url(#footerGrid)" />

  <!-- Animated Waves across Top of Footer -->
  <g opacity="0.4">
    <path class="wave-line" d="M 0 15 Q 112.5 0, 225 15 T 450 15 T 675 15 T 900 15 T 1125 15 T 1350 15" fill="none" stroke="#00ff66" stroke-width="2" />
    <path class="wave-line" d="M 0 20 Q 112.5 5, 225 20 T 450 20 T 675 20 T 900 20 T 1125 20 T 1350 20" fill="none" stroke="#00f0ff" stroke-width="1.5" />
  </g>

  <!-- Corner Brackets -->
  <path d="M 12 95 L 12 100 L 25 100" fill="none" stroke="#00ff66" stroke-width="2" />
  <path d="M 888 95 L 888 100 L 875 100" fill="none" stroke="#00f0ff" stroke-width="2" />

  <g transform="translate(450, 56)" text-anchor="middle">
    <text class="footer-text" filter="url(#glowF)">⚡ ARCHITECTED FOR THE SILICON &amp; OPEN SOURCE COMMUNITY ⚡</text>
    <text y="24" class="footer-sub">CODED &amp; ENGINEERED BY ARUN.P.S // CID-MOOSA</text>
  </g>
</svg>

<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 70" width="100%" height="100%">
  <defs>
    <!-- Dark Surface Gradient -->
    <linearGradient id="footerBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0d1117" />
      <stop offset="50%" stop-color="#0a0e14" />
      <stop offset="100%" stop-color="#080c10" />
    </linearGradient>

    <!-- Top Hairline Accent Gradient -->
    <linearGradient id="footerAccent" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#3fb950" stop-opacity="0" />
      <stop offset="50%" stop-color="#3fb950" stop-opacity="0.6" />
      <stop offset="100%" stop-color="#58a6ff" stop-opacity="0" />
    </linearGradient>
  </defs>

  <style>
    @keyframes footerScan {
      0% { stroke-dashoffset: 700; }
      100% { stroke-dashoffset: -700; }
    }
    @keyframes dotPulse {
      0%, 100% { opacity: 1; transform: scale(1); }
      50% { opacity: 0.35; transform: scale(0.8); }
    }
    .footer-scanline {
      stroke-dasharray: 120 580;
      animation: footerScan 4s linear infinite;
    }
    .footer-dot {
      animation: dotPulse 2.5s ease-in-out infinite;
      transform-origin: 450px 1px;
    }
    .footer-kicker {
      font-family: 'SF Mono', 'Cascadia Code', 'Fira Code', 'Consolas', monospace;
      font-size: 9.5px;
      font-weight: 600;
      letter-spacing: 2.8px;
      fill: #8b949e;
    }
    .footer-signature {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', 'Noto Sans', sans-serif;
      font-size: 11.5px;
      letter-spacing: 1px;
      fill: #f0f6fc;
    }
    .footer-alias {
      font-family: 'SF Mono', 'Cascadia Code', 'Fira Code', monospace;
      font-weight: 600;
      fill: #3fb950;
    }
    .footer-detail {
      font-family: 'SF Mono', 'Cascadia Code', 'Fira Code', monospace;
      fill: #7d8590;
      font-size: 11px;
    }
  </style>

  <!-- Container Box -->
  <rect width="900" height="70" rx="8" fill="url(#footerBg)" stroke="#21262d" stroke-width="1" />

  <!-- Top Accent Hairline & Scanning Laser Beam -->
  <line x1="100" y1="1" x2="800" y2="1" stroke="#21262d" stroke-width="1" />
  <line x1="100" y1="1" x2="800" y2="1" stroke="url(#footerAccent)" stroke-width="1.8" class="footer-scanline" />
  <circle cx="450" cy="1" r="1.5" fill="#3fb950" class="footer-dot" />

  <!-- Flanking Engineering Brackets -->
  <path d="M 22 25 L 15 25 L 15 45 L 22 45" fill="none" stroke="#30363d" stroke-width="1" />
  <path d="M 878 25 L 885 25 L 885 45 L 878 45" fill="none" stroke="#30363d" stroke-width="1" />

  <!-- Centered Engineering Attribution Content -->
  <g transform="translate(450, 31)" text-anchor="middle">
    <text class="footer-kicker">DIGITAL FORENSICS  •  HARDWARE SECURITY  •  OPEN SOURCE SYSTEMS</text>
  </g>

  <g transform="translate(450, 51)" text-anchor="middle">
    <text class="footer-signature">ARUN.P.S <tspan class="footer-alias">// cid-moosa</tspan> <tspan class="footer-detail">— Engineered for low-level precision</tspan></text>
  </g>
</svg>

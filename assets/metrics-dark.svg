<svg id="metrics-dark" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 220" width="100%" role="img" aria-label="GitHub profile metrics for cid-moosa">
  <title>cid-moosa GitHub Telemetry (dark)</title>
  <defs>
    <clipPath id="langBarClip"><rect x="28" y="138" width="844" height="8" rx="4"/></clipPath>
  </defs>
  <style>
    #metrics-dark .hdr { font-family: 'JetBrains Mono', ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; font-size: 11px; font-weight: 600; letter-spacing: 1.5px; fill: #8b949e; }
    #metrics-dark .meta { font-family: 'JetBrains Mono', ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; font-size: 10px; font-weight: 500; letter-spacing: 1px; fill: #6e7681; }
    #metrics-dark .kpi-lbl { font-family: 'JetBrains Mono', ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; font-size: 10px; font-weight: 600; letter-spacing: 1.2px; fill: #6e7681; }
    #metrics-dark .kpi-val { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif; font-size: 24px; font-weight: 700; fill: #f0f6fc; }
    #metrics-dark .kpi-sub { font-family: 'JetBrains Mono', ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; font-size: 11px; font-weight: 500; fill: #8b949e; }
    #metrics-dark .kpi-acc { font-family: 'JetBrains Mono', ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; font-size: 11px; font-weight: 600; fill: #38bdf8; }
    #metrics-dark .leg-name { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif; font-size: 11px; font-weight: 600; fill: #f0f6fc; }
    #metrics-dark .leg-pct { font-family: 'JetBrains Mono', ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; font-size: 10.5px; font-weight: 500; fill: #8b949e; }
    #metrics-dark .tag-txt { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif; font-size: 11px; font-weight: 500; fill: #f0f6fc; }
    #metrics-dark .bar-reveal { transform-origin: 28px 142px; animation: barReveal-dark 0.85s cubic-bezier(0.22, 1, 0.36, 1); }
    #metrics-dark .pulse-dot { animation: softPulse-dark 3.2s ease-in-out infinite; }
    @keyframes barReveal-dark { from { transform: scaleX(0.08); opacity: 0.35; } to { transform: scaleX(1); opacity: 1; } }
    @keyframes softPulse-dark { 0%, 100% { opacity: 1; } 50% { opacity: 0.45; } }
    @media (prefers-reduced-motion: reduce) { #metrics-dark .bar-reveal, #metrics-dark .pulse-dot { animation: none; transform: none; opacity: 1; } }
  </style>
  <rect x="0" y="0" width="900" height="220" fill="#0d1117"/>

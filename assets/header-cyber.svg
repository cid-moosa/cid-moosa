<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 220" width="100%" height="100%">
  <defs>
    <!-- Dark Surface Gradient -->
    <linearGradient id="headerBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0d1117" />
      <stop offset="50%" stop-color="#0a0e14" />
      <stop offset="100%" stop-color="#080c10" />
    </linearGradient>

    <!-- Chrome Top Bar Gradient -->
    <linearGradient id="chromeGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#161b22" />
      <stop offset="100%" stop-color="#0f1319" />
    </linearGradient>

    <!-- Micro Precision Dot Matrix Grid -->
    <pattern id="labGrid" width="20" height="20" patternUnits="userSpaceOnUse">
      <circle cx="10" cy="10" r="0.8" fill="#30363d" fill-opacity="0.45" />
    </pattern>

    <!-- Hairline Accent Gradient -->
    <linearGradient id="accentHairline" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#3fb950" stop-opacity="0" />
      <stop offset="50%" stop-color="#3fb950" stop-opacity="0.6" />
      <stop offset="100%" stop-color="#58a6ff" stop-opacity="0" />
    </linearGradient>
  </defs>

  <style>
    @keyframes pulseSlow {
      0%, 100% { opacity: 1; transform: scale(1); }
      50% { opacity: 0.3; transform: scale(0.9); }
    }
    @keyframes cursorBlink {
      0%, 45% { opacity: 1; }
      50%, 95% { opacity: 0; }
      100% { opacity: 1; }
    }
    @keyframes scanBeam {
      0% { stroke-dashoffset: 700; }
      100% { stroke-dashoffset: -700; }
    }
    @keyframes signalRunLeft {
      0% { stroke-dashoffset: 140; opacity: 0; }
      20% { opacity: 0.9; }
      80% { opacity: 0.9; }
      100% { stroke-dashoffset: 0; opacity: 0; }
    }
    @keyframes signalRunRight {
      0% { stroke-dashoffset: -140; opacity: 0; }
      20% { opacity: 0.9; }
      80% { opacity: 0.9; }
      100% { stroke-dashoffset: 0; opacity: 0; }
    }
    @keyframes badgeGlow1 {
      0%, 100% { stroke: #30363d; fill: #161b22; }
      25% { stroke: #3fb950; fill: #111a16; }
    }
    @keyframes badgeGlow2 {
      0%, 100% { stroke: #30363d; fill: #161b22; }
      50% { stroke: #38bdf8; fill: #0f1923; }
    }
    @keyframes badgeGlow3 {
      0%, 100% { stroke: #30363d; fill: #161b22; }
      75% { stroke: #a371f7; fill: #191424; }
    }
    @keyframes badgeGlow4 {
      0%, 100% { stroke: #30363d; fill: #161b22; }
      90% { stroke: #3fb950; fill: #111a16; }
    }
    .status-pulse {
      animation: pulseSlow 2.5s ease-in-out infinite;
      transform-origin: 0 0;
    }
    .cursor-blink {
      animation: cursorBlink 1.1s infinite;
      fill: #38bdf8;
    }
    .scan-line {
      stroke-dasharray: 140 560;
      animation: scanBeam 4.5s linear infinite;
    }
    .trace-pulse-left {
      stroke-dasharray: 25 115;
      animation: signalRunLeft 3.2s ease-in-out infinite;
    }
    .trace-pulse-right {
      stroke-dasharray: 25 115;
      animation: signalRunRight 3.2s ease-in-out infinite;
      animation-delay: 1.6s;
    }
    .badge-box-1 { animation: badgeGlow1 6s ease-in-out infinite; }
    .badge-box-2 { animation: badgeGlow2 6s ease-in-out infinite; }
    .badge-box-3 { animation: badgeGlow3 6s ease-in-out infinite; }
    .badge-box-4 { animation: badgeGlow4 6s ease-in-out infinite; }
    .text-title {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', 'Noto Sans', Helvetica, Arial, sans-serif;
      font-weight: 800;
      font-size: 32px;
      letter-spacing: 2.5px;
      fill: #f0f6fc;
    }
    .text-alias {
      font-family: 'SF Mono', 'Cascadia Code', 'Fira Code', 'Consolas', monospace;
      font-weight: 500;
      font-size: 21px;
      letter-spacing: 1px;
      fill: #7d8590;
    }
    .text-sub {
      font-family: 'SF Mono', 'Cascadia Code', 'Fira Code', 'Consolas', monospace;
      font-weight: 600;
      font-size: 11px;
      letter-spacing: 2px;
      fill: #38bdf8;
    }
    .text-detail {
      font-family: 'SF Mono', 'Cascadia Code', 'Fira Code', 'Consolas', monospace;
      font-size: 9.5px;
      letter-spacing: 1.5px;
      fill: #8b949e;
    }
    .text-badge {
      font-family: 'SF Mono', 'Cascadia Code', 'Fira Code', 'Consolas', monospace;
      font-size: 10px;
      font-weight: 500;
      letter-spacing: 1px;
      fill: #c9d1d9;
    }
  </style>

  <!-- Card Background -->
  <rect width="900" height="220" rx="8" fill="url(#headerBg)" stroke="#30363d" stroke-width="1" />
  <rect width="900" height="220" rx="8" fill="url(#labGrid)" />

  <!-- Terminal Chrome Top Bar -->
  <rect width="900" height="34" rx="8" fill="url(#chromeGrad)" />
  <rect y="26" width="900" height="8" fill="url(#chromeGrad)" />
  <line x1="0" y1="34" x2="900" y2="34" stroke="#21262d" stroke-width="1" />

  <!-- Window Controls -->
  <circle cx="22" cy="17" r="4.5" fill="#ff5f56" fill-opacity="0.85" />
  <circle cx="36" cy="17" r="4.5" fill="#ffbd2e" fill-opacity="0.85" />
  <circle cx="50" cy="17" r="4.5" fill="#27c93f" fill-opacity="0.85" />

  <!-- Shell Path & System Status -->
  <text x="72" y="21" font-family="'SF Mono', 'Cascadia Code', 'Fira Code', monospace" font-size="11" fill="#7d8590">cidmoosa@forensics-station:~$ whoami<tspan class="cursor-blink" font-weight="700">_</tspan></text>
  
  <g transform="translate(625, 17)">
    <circle cx="0" cy="0" r="3.5" fill="#3fb950" class="status-pulse" />
    <text x="10" y="3.5" font-family="'SF Mono', 'Cascadia Code', 'Fira Code', monospace" font-size="10" fill="#7d8590" letter-spacing="1">STATUS: <tspan fill="#3fb950" font-weight="600">NOMINAL</tspan> // 2.4GHz LAB</text>
  </g>

  <!-- Decorative Precision Hardware Traces with live signal packets -->
  <path d="M 22 55 L 45 55 L 60 70 L 60 90" fill="none" stroke="#21262d" stroke-width="1" />
  <path d="M 22 55 L 45 55 L 60 70 L 60 90" fill="none" stroke="#3fb950" stroke-width="1.6" class="trace-pulse-left" />
  <circle cx="60" cy="90" r="1.8" fill="#3fb950" />

  <path d="M 878 55 L 855 55 L 840 70 L 840 90" fill="none" stroke="#21262d" stroke-width="1" />
  <path d="M 878 55 L 855 55 L 840 70 L 840 90" fill="none" stroke="#38bdf8" stroke-width="1.6" class="trace-pulse-right" />
  <circle cx="840" cy="90" r="1.8" fill="#38bdf8" />

  <!-- Identity Center -->
  <g transform="translate(450, 84)" text-anchor="middle">
    <text class="text-title">ARUN.P.S <tspan class="text-alias">// cidmoosa</tspan></text>
  </g>

  <!-- Specialization Subtitle -->
  <g transform="translate(450, 114)" text-anchor="middle">
    <text class="text-sub">DIGITAL FORENSICS  •  HARDWARE REVERSE ENGINEERING  •  RF &amp; SYSTEMS AUDITING</text>
  </g>

  <!-- Research Tenet Detail -->
  <g transform="translate(450, 136)" text-anchor="middle">
    <text class="text-detail">LOW-LEVEL INVESTIGATION FROM SILICON REGISTERS TO OVER-THE-AIR PROTOCOLS</text>
  </g>

  <!-- Technical Focus Capsule Badges -->
  <g transform="translate(450, 172)" text-anchor="middle">
    <!-- Capsule 1 -->
    <g transform="translate(-320, 0)">
      <rect x="-85" y="-12" width="170" height="24" rx="4" fill="#161b22" stroke="#30363d" stroke-width="1" class="badge-box-1" />
      <text y="4" class="text-badge">[ SPI / UART DUMPS ]</text>
    </g>
    <!-- Capsule 2 -->
    <g transform="translate(-107, 0)">
      <rect x="-85" y="-12" width="170" height="24" rx="4" fill="#161b22" stroke="#30363d" stroke-width="1" class="badge-box-2" />
      <text y="4" class="text-badge">[ 802.11 INJECTION ]</text>
    </g>
    <!-- Capsule 3 -->
    <g transform="translate(107, 0)">
      <rect x="-85" y="-12" width="170" height="24" rx="4" fill="#161b22" stroke="#30363d" stroke-width="1" class="badge-box-3" />
      <text y="4" class="text-badge">[ USB OTG PROTOCOLS ]</text>
    </g>
    <!-- Capsule 4 -->
    <g transform="translate(320, 0)">
      <rect x="-85" y="-12" width="170" height="24" rx="4" fill="#161b22" stroke="#30363d" stroke-width="1" class="badge-box-4" />
      <text y="4" class="text-badge">[ EMBEDDED KERNELS ]</text>
    </g>
  </g>

  <!-- Bottom Baseline Hairline & Scanning Laser Beam -->
  <line x1="120" y1="204" x2="780" y2="204" stroke="#21262d" stroke-width="1" />
  <line x1="120" y1="204" x2="780" y2="204" stroke="url(#accentHairline)" stroke-width="2" class="scan-line" />
  <circle cx="450" cy="204" r="1.5" fill="#3fb950" class="status-pulse" />
</svg>

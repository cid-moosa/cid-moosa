      <!-- Frontier Rotating Radar Ring -->
      <circle cx="627.8" cy="85.0" r="9" fill="none" stroke="#38bdf8" stroke-width="1" stroke-dasharray="2,2" opacity="0.7">
        <animateTransform attributeName="transform" type="rotate" from="0 627.8 85.0" to="360 627.8 85.0" dur="4s" repeatCount="indefinite" />
      </circle>
      <!-- Milestone Arrival Shockwave -->

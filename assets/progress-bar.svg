        <animate attributeName="r" values="2; 2; 16; 22" keyTimes="0; 0.72; 0.770; 1" dur="5.0s" repeatCount="indefinite" />
        <animate attributeName="opacity" values="0; 0; 0.9; 0" keyTimes="0; 0.72; 0.760; 1" dur="5.0s" repeatCount="indefinite" />
